// 从AI回复解析阅读计划
function parseBookPlanFromText(reply) {
  if (!reply) return null;
  let data = null;
  data = extractJsonFromText(reply);
  if (!data || !data.plan) {
    const plan = [];
    const cleanedReply = cleanMarkdown(reply);
    // 识别阶段：前N天、第X-Y天
    const phaseRegex = /(?:前\s*(\d+)\s*天|第\s*(\d+)\s*[-~到至]\s*(\d+)\s*天|第\s*(\d+)\s*天到第\s*(\d+)\s*天)/gi;
    const phases = [];
    let pm;
    while ((pm = phaseRegex.exec(cleanedReply)) !== null) {
      let startDay, endDay;
      if (pm[1]) { startDay = 1; endDay = parseInt(pm[1]); }
      else if (pm[2]) { startDay = parseInt(pm[2]); endDay = parseInt(pm[3]); }
      else { startDay = parseInt(pm[4]); endDay = parseInt(pm[5]); }
      phases.push({ start: startDay, end: endDay, startIndex: pm.index });
    }
    // 识别 Day 标记
    const dayRegex = /(?:Day\s*(\d+)|day\s*(\d+)|第\s*(\d+|[一二三四五六七八九十]+)\s*天)/gi;
    const dayPositions = [];
    const chineseNumMap = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
    let dm;
    while ((dm = dayRegex.exec(cleanedReply)) !== null) {
      let dayNum = parseInt(dm[1] || dm[2] || dm[3]);
      if (isNaN(dayNum) && dm[3]) dayNum = chineseNumMap[dm[3]] || 1;
      dayPositions.push({ day: dayNum, start: dm.index });
    }
    const processDay = function(globalDay, start, end) {
      const dayText = cleanedReply.slice(start, end);
      let content = '';
      const contentMatch = dayText.match(/[:：]\s*(.+?)(?:\n|$)/);
      if (contentMatch) {
        content = cleanMarkdown(contentMatch[1].trim());
      } else {
        content = cleanMarkdown(dayText.replace(/Day\s*\d+[：:]?\s*/i, '').replace(/第\s*\d+\s*天[：:]?\s*/, '').trim()).slice(0, 150);
      }
      if (content && content.length > 2 && !/^(第.+天|阶段|Phase|核心原则|目标|说明|一[、.．]|二[、.．]|三[、.．])/.test(content)) {
        plan.push({ day: globalDay, content: content });
      }
    };
    // 情况1：有阶段 + 有Day标记
    if (phases.length > 0 && dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        let currentPhase = null;
        for (let j = phases.length - 1; j >= 0; j--) {
          if (phases[j].startIndex < dayInfo.start) { currentPhase = phases[j]; break; }
        }
        let globalDay = dayInfo.day;
        if (currentPhase && currentPhase.start !== null) globalDay = currentPhase.start + dayInfo.day - 1;
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        processDay(globalDay, dayInfo.start, end);
      }
    }
    // 情况2：有阶段但没有Day标记 → 阶段内容按天分配
    else if (phases.length > 0) {
      for (let i = 0; i < phases.length; i++) {
        const phase = phases[i];
        const end = i < phases.length - 1 ? phases[i+1].startIndex : cleanedReply.length;
        const phaseText = cleanedReply.slice(phase.startIndex, end);
        const oldLen = plan.length;
        processDay(1, phase.startIndex, end);
        if (plan.length > oldLen && phase.end >= phase.start) {
          const content = plan[plan.length-1].content;
          plan.length = oldLen; // 回退
          const numDays = phase.end - phase.start + 1;
          for (let d = 0; d < numDays; d++) {
            plan.push({ day: phase.start + d, content: content });
          }
        }
      }
    }
    // 情况3：有Day标记但没有阶段
    else if (dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        processDay(dayInfo.day, dayInfo.start, end);
      }
    }
    // 情况4：都没有，按段落分割（跳过标题）
    else {
      const sections = cleanedReply.split(/\n\n+/);
      let dayCount = 0;
      for (const section of sections) {
        const trimmed = section.trim();
        if (trimmed.length < 10) continue;
        if (/^(一[、.．]|二[、.．]|三[、.．]|四[、.．]|五[、.．]|整体|核心原则|目标|说明|备注)/.test(trimmed)) continue;
        const oldLen = plan.length;
        processDay(1, 0, trimmed.length);
        if (plan.length > oldLen) {
          dayCount++;
          plan[plan.length-1].day = dayCount;
        }
      }
    }
    if (plan.length > 0) data = { plan: plan };
  }
  return data;
}

async function saveBookPlanToDB(data, bookTitle, bookAuthor) {
  // 1. 创建书的记录
  const bookId = genId();
  await dbAdd('books', {
    id: bookId,
    title: bookTitle,
    author: bookAuthor || '未知作者',
    status: 'reading',
    progress: 0,
    totalPages: null,
    currentPage: null,
    rating: null,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    aiGenerated: true
  });

  // 2. 获取或创建"阅读计划"自定义模块
  let moduleConfig = await dbGet('settings', 'moduleConfig');
  if (!moduleConfig) moduleConfig = { hiddenModules: [], customModules: [] };
  let readingModule = moduleConfig.customModules.find(function(m) { return m.name === '阅读计划'; });
  if (!readingModule) {
    readingModule = { id: 'reading-plan-' + genId(), name: '阅读计划', icon: '📖', color: '#9c27b0', createdAt: Date.now() };
    moduleConfig.customModules.push(readingModule);
    await dbPut('settings', moduleConfig);
  }

  // 3. 按天保存阅读任务
  const today = new Date();
  let total = 0;
  for (const dayPlan of data.plan) {
    const dayOffset = dayPlan.day - 1;
    const date = new Date(today);
    date.setDate(today.getDate() + dayOffset);
    const dateStr = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
    await dbAdd('customItems', {
      id: genId(),
      moduleId: readingModule.id,
      title: '第' + dayPlan.day + '天：' + (dayPlan.content || '阅读任务'),
      content: dayPlan.content || '',
      date: dateStr,
      createdAt: Date.now(),
      aiGenerated: true,
      bookId: bookId
    });
    total++;
  }
  return { total: total, moduleId: readingModule.id };
}

async function generateBookAiPlan(title, author, days, time) {
  if (!aiApiKey) { showToast('请先在设置中配置 API Key', 'error'); return; }
  showToast('AI 正在生成阅读计划...', 'info');
  const prompt = `你是一个阅读规划专家。请为用户制定一份《${title}》的阅读计划。
${author ? '作者：' + author : ''}
计划天数：${days}天
每天阅读时间：${time}分钟

【重要】你的回复必须是纯JSON对象，不能包含任何其他文字、解释或markdown标记。直接以{开头，以}结尾。

JSON格式：
{"plan":[{"day":1,"content":"阅读第1-3章，了解...背景"},{"day":2,"content":"阅读第4-5章，重点理解..."}]}

规则：
1. day从1开始，连续编号，共${days}天
2. content是当天的阅读内容和重点提示，简洁明了
3. 只返回JSON，不要任何其他内容`;

  try {
    const reply = await callDoubaoApi([{ role: 'user', content: prompt }]);
    const data = parseBookPlanFromText(reply);
    if (!data || !data.plan || data.plan.length === 0) {
      openModal({
        title: 'AI 返回内容（无法自动解析）',
        bodyHTML:
          '<div style="max-height:400px;overflow-y:auto;padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">' +
          escapeHtml(reply) +
          '</div>' +
          '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn-primary" id="saveAsBookNote" style="padding:6px 14px;font-size:13px;">保存为读书想法</button>' +
            '<button class="btn-secondary" id="retryBookPlan" style="padding:6px 14px;font-size:13px;">重新生成</button>' +
          '</div>',
        confirmText: '关闭',
        onConfirm: function() { return true; }
      });
      setTimeout(function() {
        const saveBtn = document.getElementById('saveAsBookNote');
        if (saveBtn) saveBtn.addEventListener('click', async function() {
          await dbAdd('books', {
            id: genId(), title: reply.slice(0, 30), author: 'AI生成',
            status: 'want', progress: 0, rating: 0, notes: reply,
            createdAt: Date.now(), updatedAt: Date.now(), aiGenerated: true
          });
          showToast('已保存为读书想法', 'success');
          closeModal();
          renderBooks();
        });
        const retryBtn = document.getElementById('retryBookPlan');
        if (retryBtn) retryBtn.addEventListener('click', function() {
          closeModal();
          showBookAiPlanForm();
        });
      }, 100);
      return;
    }
    const result = await saveBookPlanToDB(data, title, author);
    showToast('已生成 ' + result.total + ' 天阅读计划，已创建「阅读计划」模块', 'success');
    renderBooks();
    if (typeof renderSidebar === 'function') renderSidebar();
    setTimeout(function() { navigateTo(result.moduleId); }, 800);
  } catch(err) {
    console.error('阅读计划生成失败', err);
    showToast('生成失败：' + err.message, 'error');
  }
}

      notes.sort(function(a, b) { return b.createdAt - a.createdAt; });
      detailView.innerHTML =
        '<div class="book-detail-header">' +
          '<button class="book-back-btn" id="bookBackBtn">← 返回书架</button>' +
        '</div>' +
        '<div class="book-detail-info">' +
          '<div class="title">' + escapeHtml(book.title) + '</div>' +
          '<div class="author">' + escapeHtml(book.author || '未知作者') + '</div>' +
          '<div class="progress-row">' +
            '<span style="font-size:13px;">进度</span>' +
            '<input type="range" min="0" max="100" value="' + (book.progress || 0) + '" id="bookProgressSlider">' +
            '<span class="progress-text" id="bookProgressText">' + (book.progress || 0) + '%</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">' +
            '<span style="font-size:13px;">状态</span>' +
            '<select class="status-select" id="bookStatusSelect">' +
              '<option value="want" ' + (book.status === 'want' ? 'selected' : '') + '>想读</option>' +
              '<option value="reading" ' + (book.status === 'reading' ? 'selected' : '') + '>在读</option>' +
              '<option value="finished" ' + (book.status === 'finished' ? 'selected' : '') + '>已读完</option>' +
            '</select>' +
            (book.status === 'finished' ? '<span style="font-size:13px;">评分</span><select class="status-select" id="bookRatingSelect"><option value="">未评分</option><option value="1" ' + (book.rating === 1 ? 'selected' : '') + '>⭐</option><option value="2" ' + (book.rating === 2 ? 'selected' : '') + '>⭐⭐</option><option value="3" ' + (book.rating === 3 ? 'selected' : '') + '>⭐⭐⭐</option><option value="4" ' + (book.rating === 4 ? 'selected' : '') + '>⭐⭐⭐⭐</option><option value="5" ' + (book.rating === 5 ? 'selected' : '') + '>⭐⭐⭐⭐⭐</option></select>' : '') +
            '<button class="btn" id="editBookBtn" style="margin-left:auto;">编辑</button>' +
            '<button class="btn btn-danger" id="deleteBookBtn">删除</button>' +
          '</div>' +
        '</div>' +
        '<div class="add-note-form">' +
          '<select id="noteTypeSelect"><option value="note">💭 感悟</option><option value="quote">📝 金句</option></select>' +
          '<textarea id="noteContentInput" placeholder="写下你的感悟或金句..."></textarea>' +
          '<div class="form-row">' +
            '<input type="text" id="noteChapterInput" placeholder="章节（可选）" style="flex:1;">' +
            '<input type="number" id="notePageInput" placeholder="页码（可选）" style="width:100px;">' +
            '<button class="btn-primary" id="addNoteBtn">添加笔记</button>' +
          '</div>' +
        '</div>' +
        '<div class="notes-timeline" id="notesTimeline">' +
          (notes.length === 0 ? '<div class="empty-state"><div class="icon">✍️</div>还没有笔记</div>' :

              '<div class="note-actions">' +
                '<button class="note-delete-btn" title="删除">✕</button>' +
              '</div>' +
              '<span class="note-type-badge ' + note.type + '">' + (note.type === 'quote' ? '金句' : '感悟') + '</span>' +
              '<div class="note-content">' + escapeHtml(note.content) + '</div>' +
              '<div class="note-meta">' +
                '<span>' + (note.chapter ? note.chapter : '') + (note.page ? ' p.' + note.page : '') + '</span>' +
                '<span>' + new Date(note.createdAt).toLocaleDateString() + '</span>' +
              '</div>' +

          }).join('')) +
        '</div>';

      // Bind events
      document.getElementById('bookBackBtn').addEventListener('click', showBooksShelf);
      document.getElementById('bookProgressSlider').addEventListener('input', function() {
        document.getElementById('bookProgressText').textContent = this.value + '%';
      });
      document.getElementById('bookProgressSlider').addEventListener('change', function() {
        book.progress = parseInt(this.value);
        dbPut('books', book);
        showToast('进度已更新');

      document.getElementById('bookStatusSelect').addEventListener('change', function() {

        });

      const ratingSelect = document.getElementById('bookRatingSelect');

        ratingSelect.addEventListener('change', function() {
          book.rating = this.value ? parseInt(this.value) : null;
          dbPut('books', book);
          showToast('评分已更新');
        });
      }
      document.getElementById('editBookBtn').addEventListener('click', function() { openAddBookModal(book); });
      document.getElementById('deleteBookBtn').addEventListener('click', function() { deleteBook(bookId); });
      document.getElementById('addNoteBtn').addEventListener('click', function() { addNote(bookId); });

      // Bind note delete
      document.querySelectorAll('.note-delete-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const noteItem = btn.closest('.note-item');
          deleteNote(noteItem.dataset.id, bookId);
        });
      });
    });
  });
}

function openAddBookModal(existing) {
  const isEdit = !!existing;
  openModal({
    title: isEdit ? '编辑书籍' : '添加书籍',
    bodyHTML:
      '<div class="form-group"><label>书名</label><input type="text" id="bookTitleInput" value="' + escapeHtml(existing ? (existing.title || '') : '') + '"></div>' +
      '<div class="form-group"><label>作者</label><input type="text" id="bookAuthorInput" value="' + escapeHtml(existing ? (existing.author || '') : '') + '"></div>' +
      '<div class="form-group"><label>状态</label><select id="bookStatusModalSelect">' +
        '<option value="want" ' + (existing && existing.status === 'want' ? 'selected' : '') + '>想读</option>' +
        '<option value="reading" ' + (!existing || existing.status === 'reading' ? 'selected' : '') + '>在读</option>' +
        '<option value="finished" ' + (existing && existing.status === 'finished' ? 'selected' : '') + '>已读完</option>' +
      '</select></div>' +
      (isEdit ? '<div class="form-group"><label>阅读进度 (%)</label><input type="number" id="bookProgressInput" min="0" max="100" value="' + (existing ? (existing.progress || 0) : 0) + '"></div>' : ''),
    onConfirm: function() {
      const title = document.getElementById('bookTitleInput').value.trim();
      const author = document.getElementById('bookAuthorInput').value.trim();
      const status = document.getElementById('bookStatusModalSelect').value;
      if (!title) { showToast('请输入书名', 'error'); return false; }
      if (isEdit) {
        existing.title = title;
        existing.author = author;
        existing.status = status;
        const progressInput = document.getElementById('bookProgressInput');
        if (progressInput) existing.progress = parseInt(progressInput.value) || 0;
        existing.updatedAt = Date.now();
        dbPut('books', existing).then(function() {
          if (window._booksCurrentBookId === existing.id) openBookDetail(existing.id);
          else showBooksShelf();
          showToast('已更新');
        });
      } else {
        dbAdd('books', {
          id: genId(), title: title, author: author, status: status,
          progress: 0, totalPages: null, currentPage: null, rating: null,
          createdAt: Date.now(), updatedAt: Date.now()
        }).then(function() {
          window._booksCurrentStatus = status;
          document.querySelectorAll('.books-tab').forEach(function(t) {
            t.classList.toggle('active', t.dataset.status === status);
          });
          showBooksShelf();
          showToast('已添加');
        });
      }
    }
  });
}

function addNote(bookId) {
  const type = document.getElementById('noteTypeSelect').value;
  const content = document.getElementById('noteContentInput').value.trim();
  const chapter = document.getElementById('noteChapterInput').value.trim();
  const page = parseInt(document.getElementById('notePageInput').value) || null;
  if (!content) { showToast('请输入笔记内容', 'error'); return; }
  dbAdd('bookNotes', {
    id: genId(), bookId: bookId, type: type,
    content: content, chapter: chapter, page: page, createdAt: Date.now()
  }).then(function() {
    showToast('笔记已添加');
    openBookDetail(bookId);
  });
}

function deleteNote(noteId, bookId) {
  dbDelete('bookNotes', noteId).then(function() {
    showToast('已删除');
    openBookDetail(bookId);
  });
}

function deleteBook(bookId) {
  showConfirm({
    title: '删除书籍',
    message: '确定删除这本书吗？关联的笔记也会被删除。',
    danger: true,
    onConfirm: function() {
      dbGetByIndex('bookNotes', 'bookId', bookId).then(function(notes) {
        return Promise.all(notes.map(function(n) { return dbDelete('bookNotes', n.id); }));
      }).then(function() {
        return dbDelete('books', bookId);
      }).then(function() {
        showToast('已删除');
        showBooksShelf();
      });
    }
  });
}

// 每日提醒功能
let _reminderInterval = null;
let _lastReminderDate = null;

function startReminderCheck() {
  stopReminderCheck();
  _reminderInterval = setInterval(checkReminder, 60000); // 每分钟检查一次
  checkReminder(); // 立即检查一次
}

function stopReminderCheck() {
  if (_reminderInterval) {
    clearInterval(_reminderInterval);
    _reminderInterval = null;
  }
}

function checkReminder() {
  if (localStorage.getItem('reminderEnabled') !== '1') return;
  const reminderTime = localStorage.getItem('reminderTime') || '08:00';
  const now = new Date();
  const currentTime = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const todayStr = now.toDateString();
  
  // 只在提醒时间后的10分钟内发送，且今天还没发送过
  if (currentTime >= reminderTime && _lastReminderDate !== todayStr) {
    _lastReminderDate = todayStr;
    sendDailyReminder();
  }
}

function sendDailyReminder() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  
  const today = todayStr();
  // 汇总今天所有未完成任务
  Promise.all([
    dbGetAll('tasks'),
    dbGetAll('english'),
    dbGetAll('workouts')
  ]).then(function(results) {
    const tasks = results[0].filter(function(t) { return t.date === today && !t.completed; });
    const english = results[1].filter(function(t) { return t.date === today && !t.completed; });
    const workouts = results[2].filter(function(t) { return t.date === today; });
    
    const totalPending = tasks.length + english.length + workouts.length;
    let body = '';
    if (totalPending === 0) {
      body = '今天所有任务都完成了，太棒了！';
    } else {
      const parts = [];
      if (tasks.length > 0) parts.push('待办' + tasks.length + '项');
      if (english.length > 0) parts.push('英语' + english.length + '项');
      if (workouts.length > 0) parts.push('健身' + workouts.length + '项');
      body = '今日待完成：' + parts.join('，') + '。打开APP开始吧！';
    }
    
    try {
      new Notification('无量空处 - 每日提醒', {
        body: body,
        icon: 'icon.jpg',
        badge: 'icon.jpg'
      });
    } catch(e) {
      console.log('通知发送失败:', e);
    }
  });
}

function exportAllData() {
  const stores = ['tasks', 'media', 'english', 'experiments', 'files', 'workouts', 'meals', 'games', 'gameLogs', 'books', 'bookNotes', 'memo', 'settings', 'customItems'];
  Promise.all(stores.map(function(s) { return dbGetAll(s); })).then(function(results) {
    const data = { version: '1.0.0', exportedAt: new Date().toISOString(), stores: {} };
    stores.forEach(function(s, i) { data.stores[s] = results[i]; });
    const json = JSON.stringify(data, function(key, value) {
      if (value instanceof ArrayBuffer) {
        return { __type: 'ArrayBuffer', data: arrayBufferToBase64(value) };
      }
      return value;
    }, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'personal-app-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出');
  });
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function importAllData(file) {
  showConfirm({
    title: '导入数据',
    message: '导入将覆盖当前所有数据，确定继续吗？建议先导出当前数据备份。',
    danger: true,
    onConfirm: function() {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.stores) throw new Error('无效的备份文件格式');
          // 版本检查
          if (data.version && data.version !== '1.0.0') {
            showToast('警告：备份文件版本 ' + data.version + ' 与当前版本可能不兼容', 'error');
          }
          const stores = Object.keys(data.stores);
          let importCount = 0;
          const promises = stores.map(function(storeName) {
            return dbClear(storeName).then(function() {
              const items = data.stores[storeName] || [];
              const restoredItems = items.map(function(item) {
                // Restore ArrayBuffer fields
                Object.keys(item).forEach(function(key) {
                  if (item[key] && item[key].__type === 'ArrayBuffer') {
                    item[key] = base64ToArrayBuffer(item[key].data);
                  }
                });
                return item;
              });
              importCount += restoredItems.length;
              return Promise.all(restoredItems.map(function(item) { return dbAdd(storeName, item); }));
            });
          });
          Promise.all(promises).then(function() {
            showToast('已导入 ' + importCount + ' 条数据');
            setTimeout(function() { location.reload(); }, 1000);
          }).catch(function(err) {
            showToast('导入失败：' + err.message, 'error');
          });
        } catch (err) {
          showToast('文件解析失败：' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }
  });
}

        date: todayStr(),

    } else if (action === 'save-idea') {

        if (!window._moduleConfig) window._moduleConfig = { hiddenModules: [], customModules: [] };
        window._moduleConfig.customModules.push(noteModule);
        await saveModuleConfig();
      }
      await dbAdd('customItems', {
        id: genId(),
        moduleId: noteModule.id,
        title: title,
        content: content,
        date: todayStr(),
        createdAt: Date.now()
      });
      showToast('已保存到「AI笔记」模块', 'success');
    } else if (action === 'save-custom') {
      // 让用户选择自定义模块
      const customModules = window._moduleConfig?.customModules || [];
      if (customModules.length === 0) {
        showToast('请先在设置中创建自定义模块', 'error');
        return;
      }
      const moduleNames = customModules.map((m, i) => (i+1) + '. ' + m.name).join('\\n');
      const idx = prompt('选择要保存到的自定义模块：\\n' + moduleNames);
      if (!idx) return;

      if (isNaN(moduleIdx) || moduleIdx < 0 || moduleIdx >= customModules.length) {
        showToast('选择无效', 'error');
        return;

      const targetModule = customModules[moduleIdx];

        content: content,
        date: todayStr(),
        createdAt: Date.now()
      });

    }
  } catch(err) {
    showToast('保存失败：' + err.message, 'error');
  }
}

async function callDoubaoApi(messages) {
  if (!aiApiKey) throw new Error('请先配置 API Key');
  const body = {
    model: AI_MODEL,
    messages: messages,
    temperature: 0.7,
    max_tokens: 8192
  };
  if (window._aiThinkingEnabled) {
    body.thinking = { type: 'enabled' };
  } else {
    body.thinking = { type: 'disabled' };
  }
  const res = await fetch(AI_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + aiApiKey
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errText = await res.text();
    let friendlyMsg = 'API 错误 ' + res.status;
    if (res.status === 401) friendlyMsg = 'API Key 无效或已过期，请在设置中检查';
    else if (res.status === 404) friendlyMsg = '模型不存在或已下线，请检查模型名称';
    else if (res.status === 429) friendlyMsg = '请求过于频繁，请稍后再试';
    else if (res.status === 500) friendlyMsg = '服务器内部错误，请稍后再试';
    else if (errText.includes('ModelNotOpen')) friendlyMsg = '模型未开通，请在火山引擎控制台开通该模型';
    else if (errText.includes('InsufficientBalance')) friendlyMsg = '账户余额不足，请充值';
    throw new Error(friendlyMsg + '：' + errText.slice(0, 100));
  }
  const data = await res.json();
  const msg = data.choices[0].message;
  // 如果有思考内容，拼接到回复前面
  if (msg.reasoning_content && msg.reasoning_content.trim()) {
    return '💭 思考过程：\n' + msg.reasoning_content + '\n\n---\n\n' + msg.content;
  }
  return msg.content;
}

async function sendAiMessage(text) {
  if (!text.trim()) return;
  if (!aiApiKey) {
    appendAiMessage('assistant', '请先在「设置」页面配置火山引擎豆包 API Key。');
    return;
  }
  appendAiMessage('user', text);
  aiConversation.push({ role: 'user', content: text });
  // 限制对话历史长度，最多保留20条（避免token消耗过大）
  if (aiConversation.length > 20) {
    aiConversation = aiConversation.slice(-20);
  }
  document.getElementById('aiInput').value = '';
  document.getElementById('aiSendBtn').disabled = true;

  // 移除旧的loading指示器
  const oldTyping = document.getElementById('aiTypingIndicator');
  if (oldTyping) oldTyping.remove();

  // 创建AI消息容器（流式更新）- 不用固定ID，用变量引用
  const container = document.getElementById('aiMessages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'ai-msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="ai-typing"><span></span><span></span><span></span></div>';
  msgDiv.innerHTML = '<div class="msg-avatar">🤖</div>';
  msgDiv.appendChild(bubble);
  container.appendChild(msgDiv);
  container.scrollTop = container.scrollHeight;

  try {
    const body = {
      model: AI_MODEL,
      messages: aiConversation,
      temperature: 0.7,
      max_tokens: 8192,
      stream: true
    };
    if (window._aiThinkingEnabled) {
      body.thinking = { type: 'enabled' };
    } else {
      body.thinking = { type: 'disabled' };
    }

    const res = await fetch(AI_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + aiApiKey
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errText = await res.text();
      let friendlyMsg = 'API 错误 ' + res.status;
      if (res.status === 401) friendlyMsg = 'API Key 无效或已过期，请在设置中检查';
      else if (res.status === 404) friendlyMsg = '模型不存在或已下线，请检查模型名称';
      else if (res.status === 429) friendlyMsg = '请求过于频繁，请稍后再试';
      else if (res.status === 500) friendlyMsg = '服务器内部错误，请稍后再试';
      else if (errText.includes('ModelNotOpen')) friendlyMsg = '模型未开通，请在火山引擎控制台开通该模型';
      else if (errText.includes('InsufficientBalance')) friendlyMsg = '账户余额不足，请充值';
      throw new Error(friendlyMsg + '：' + errText.slice(0, 100));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';
    let thinkingContent = '';
    let buffer = '';
    let streamDone = false;
    bubble.innerHTML = '';

    function updateBubble() {
      const thinkingHtml = thinkingContent ? '<div style="color:var(--text-light);font-size:12px;border-left:2px solid var(--primary);padding-left:8px;margin-bottom:8px;">💭 思考过程<br>' + escapeHtml(thinkingContent) + '</div>' : '';
      bubble.innerHTML = thinkingHtml + escapeHtml(fullContent);
      container.scrollTop = container.scrollHeight;
    }

    while (!streamDone) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      buffer += chunk;
      // 按行分割，保留不完整的行在缓冲区
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') { streamDone = true; break; }
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta;
          if (delta) {
            if (delta.reasoning_content) {
              thinkingContent += delta.reasoning_content;
              updateBubble();
            }
            if (delta.content) {
              fullContent += delta.content;
              updateBubble();
            }
          }
        } catch(e) {}
      }
    }

    // 处理缓冲区剩余的最后一行
    if (buffer.trim()) {
      const trimmed = buffer.trim();
      if (trimmed.startsWith('data:')) {
        const data = trimmed.slice(5).trim();
        if (data !== '[DONE]') {
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta;
            if (delta) {
              if (delta.reasoning_content) thinkingContent += delta.reasoning_content;
              if (delta.content) fullContent += delta.content;
              updateBubble();
            }
          } catch(e) {}
        }
      }
    }

    // 流式完成，添加保存按钮
    if (fullContent.trim()) {
      aiConversation.push({ role: 'assistant', content: fullContent });
      // 限制对话历史长度
      if (aiConversation.length > 20) {
        aiConversation = aiConversation.slice(-20);
      }
      saveAiHistory();
      addSaveButtonsToMessage(msgDiv, fullContent);
    } else if (!thinkingContent) {
      bubble.innerHTML = '<span style="color:var(--text-light);">（无回复内容）</span>';
    }
  } catch(err) {
    if (bubble) bubble.innerHTML = '出错了：' + err.message + '\n\n请检查 API Key 是否正确，或网络是否可访问火山引擎。';
  }
  document.getElementById('aiSendBtn').disabled = false;
}

// 保存AI内容到具体模块
async function saveAiToModule(module, content) {
  const title = content.slice(0, 30).replace(/\n/g, ' ') + (content.length > 30 ? '...' : '');
  try {
    if (module === 'english') {
      // 尝试解析为结构化学习计划
      const planData = parseEnglishPlanFromText(content);
      if (planData && planData.plan && planData.plan.length > 0) {
        const total = await saveEnglishPlanToDB(planData);
        showToast('已解析并保存 ' + total + ' 个学习任务到英语模块', 'success');
      } else {
        // 不是计划格式，存为一条学习笔记
        await dbAdd('english', {
          id: genId(),
          date: todayStr(),
          type: 'other',
          content: content,
          duration: 0,
          completed: false,
          createdAt: Date.now(),
          aiGenerated: true
        });
        showToast('已保存到英语学习模块', 'success');
      }
    } else if (module === 'books') {
      // 尝试解析为阅读计划
      const planData = parseBookPlanFromText(content);
      if (planData && planData.plan && planData.plan.length > 0) {
        const result = await saveBookPlanToDB(planData, 'AI生成书单', '');
        showToast('已解析并保存 ' + result.total + ' 天阅读计划', 'success');
        if (typeof renderSidebar === 'function') renderSidebar();
      } else {
        // 不是计划格式，存为一本书
        await dbAdd('books', {
          id: genId(),
          title: title,
          author: 'AI生成',
          status: 'reading',
          rating: 0,
          notes: content,
          createdAt: Date.now(),
          aiGenerated: true
        });
        showToast('已保存到读书模块', 'success');
      }
    } else if (module === 'workouts') {
      // 尝试解析为结构化训练计划
      const planData = parseWorkoutPlanFromText(content);
      if (planData && planData.plan && planData.plan.length > 0) {
        // 显示预览/编辑界面
        showWorkoutPlanPreview(planData, content);
      } else {
        // 不是计划格式，存为一条训练记录
        await dbAdd('workouts', {
          id: genId(),
          date: todayStr(),
          muscleGroup: 'AI生成',
          duration: 0,
          exercises: [],
          notes: content,
          createdAt: Date.now(),
          aiGenerated: true
        });
        showToast('已保存到健身模块', 'success');
      }
    } else if (module === 'media') {
      // 存到自媒体
      await dbAdd('media', {
        id: genId(),
        title: title,
        status: 'idea',
        publishDate: null,
        platform: '',
        idea: content,
        notes: 'AI对话生成',
        views: null, likes: null, comments: null,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        aiGenerated: true
      });
      showToast('已保存到自媒体灵感库', 'success');
    } else if (module === 'tasks') {
      // 存到待办
      await dbAdd('tasks', {
        id: genId(),
        title: title,
        content: content,
        date: todayStr(),
        completed: false,
        createdAt: Date.now(),
        aiGenerated: true
      });
      showToast('已保存到待办事项', 'success');
    } else if (module === 'custom') {
      // 选择自定义模块
      const customModules = window._moduleConfig?.customModules || [];
      const allModules = [
        { id: 'experiments', name: '🧪 实验记录' },
        { id: 'meals', name: '🍽️ 饮食记录' },
        { id: 'games', name: '🎮 游戏' }
      ].concat(customModules.map(m => ({ id: m.id, name: m.icon + ' ' + m.name })));
      if (allModules.length === 0) {
        showToast('没有其他模块可选', 'error');
        return;
      }
      const moduleNames = allModules.map((m, i) => (i+1) + '. ' + m.name).join('\\n');
      const idx = prompt('选择要保存到的模块：\\n' + moduleNames);
      if (!idx) return;
      const moduleIdx = parseInt(idx) - 1;
      if (isNaN(moduleIdx) || moduleIdx < 0 || moduleIdx >= allModules.length) {
        showToast('选择无效', 'error');
        return;
      }
      const target = allModules[moduleIdx];
      if (target.id.startsWith('custom-')) {
        await dbAdd('customItems', {
          id: genId(),
          moduleId: target.id,
          title: title,
          content: content,
          date: todayStr(),
          createdAt: Date.now()
        });
      } else {
        // 预设模块用通用格式存到对应store
        await dbAdd(target.id, {
          id: genId(),
          title: title,
          content: content,
          date: todayStr(),
          createdAt: Date.now(),
          aiGenerated: true
        });
      }
      showToast('已保存到「' + target.name + '」', 'success');
    }
  } catch(err) {
    showToast('保存失败：' + err.message, 'error');
  }
}

async function saveAiHistory() {
  await dbPut('settings', { id: 'aiHistory', messages: aiConversation.slice(-20) });
}
async function loadAiHistory() {
  try {
    const data = await dbTx('settings','readonly',function(s){ return s.get('aiHistory'); });
    if (data && data.messages && data.messages.length > 0) {
      aiConversation = data.messages;
      const container = document.getElementById('aiMessages');
      container.innerHTML = '';
      data.messages.forEach(function(m) { appendAiMessage(m.role, m.content); });
    }
  } catch(e) {}
}

  document.getElementById('aiAssistantBtn').addEventListener('click', openAiModal);

// ===== Initialization =====
function init() {
  // Set date
  document.getElementById('pageDate').textContent = formatDateCN(todayStr());
  // 咒力粒子背景
  initCurseParticles();
  // Nav clicks (事件委托，支持动态渲染)
  document.getElementById('navList').addEventListener('click', function(e) {
    const item = e.target.closest('.nav-item');
    if (item) {
      navigateTo(item.dataset.page);
      // 移动端点击导航后关闭侧边栏
      closeMobileSidebar();
    }
  });
  // 移动端菜单
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const sidebar = document.querySelector('.sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  if (mobileMenuBtn && sidebar && sidebarOverlay) {
    mobileMenuBtn.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });
    sidebarOverlay.addEventListener('click', closeMobileSidebar);
  }
  function closeMobileSidebar() {
    if (sidebar) sidebar.classList.remove('open');
    if (sidebarOverlay) sidebarOverlay.classList.remove('active');
  }
  // Init DB then render home
  initDB().then(function() {
    return loadModuleConfig();
  }).then(function() {
    renderSidebar();
    initAiAssistant();
    navigateTo('home');
  }).catch(function(err) {
    console.error('DB init failed:', err);
    showToast('数据库初始化失败', 'error');
  });
}

function renderSidebar() {
  const nav = document.getElementById('navList');
  let html = '';
  PRESET_MODULES_ORDER.forEach(function(group) {
    const visibleIds = group.ids.filter(isModuleVisible);
    if (visibleIds.length === 0) return;
    html += '<div class="nav-category">' + group.category + '</div>';
    visibleIds.forEach(function(id) {
      const m = MODULES[id];
      html += '<div class="nav-item' + (currentPage === id ? ' active' : '') + '" data-page="' + id + '">' +
        '<span class="nav-dot" style="background:' + m.color + '"></span>' + m.name + '</div>';
    });
  });
  // 自定义模块
  const visibleCustom = moduleConfig.customModules.filter(function(m){ return isModuleVisible(m.id); });
  if (visibleCustom.length > 0) {
    html += '<div class="nav-category">我的</div>';
    visibleCustom.forEach(function(m) {
      html += '<div class="nav-item' + (currentPage === m.id ? ' active' : '') + '" data-page="' + m.id + '">' +
        '<span class="nav-dot" style="background:' + m.color + '"></span>' +
        (m.icon ? m.icon + ' ' : '') + m.name + '</div>';
    });
  }
  nav.innerHTML = html;
}

});

// 全局快捷键
document.addEventListener('keydown', function(e) {
  // Ctrl+K 聚焦搜索框
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    const searchInput = document.getElementById('homeSearchInput');
    if (searchInput) {
      navigateTo('home');
      setTimeout(function() { searchInput.focus(); }, 100);
    }
  }
  // Esc 关闭弹窗
  if (e.key === 'Escape') {
    const modal = document.querySelector('.modal');
    if (modal && modal.style.display !== 'none') {
      const closeBtn = modal.querySelector('.modal-close, [onclick*="closeModal"]');
      if (closeBtn) closeBtn.click();
    }
    // 关闭AI助手
    const aiModal = document.getElementById('aiModal');
    if (aiModal && aiModal.classList.contains('open')) {
      closeAiModal();
    }
  }
});

if (document.readyState === 'loading') {

// PWA: 注册 Service Worker（仅 HTTPS 或 localhost 生效）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {

    navigator.serviceWorker.register('./service-worker.js').catch(function(err) {
