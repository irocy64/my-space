    '<button class="task-delete-btn" title="删除">✕</button>' +
    '</div>';
}

function bindTaskEvents(container) {
  container.querySelectorAll('.task-item').forEach(function(item) {
    const id = item.dataset.id;
    item.querySelector('.task-checkbox').addEventListener('change', function() {
      toggleTaskComplete(id, this.checked);
    });
    item.querySelector('.task-content').addEventListener('dblclick', function() {
      editTaskContent(id, this);
    });
    item.querySelector('.task-delete-btn').addEventListener('click', function() {
      deleteTask(id);
    });
    item.querySelector('.task-edit-btn').addEventListener('click', function() {
      editTaskContent(id, item.querySelector('.task-content'));
    });
  });
}

function addTask() {
  const input = document.getElementById('taskInput');
  const select = document.getElementById('taskPrioritySelect');
  const content = input.value.trim();
  if (!content) {
    showToast('请输入任务内容', 'error');
    return;
  }
  const task = {
    id: genId(),
    content: content,
    priority: select.value,
    completed: false,
    date: todayStr(),
    createdAt: Date.now(),
    completedAt: null
  };
  return dbAdd('tasks', task).then(function() {
    input.value = '';
    showToast('已添加');
    return loadAndRenderTasks();
  });
}

function toggleTaskComplete(id, completed) {
  return dbGet('tasks', id).then(function(task) {
    if (!task) return;
    task.completed = completed;
    task.completedAt = completed ? Date.now() : null;
    return dbPut('tasks', task);
  }).then(function() {
    return loadAndRenderTasks();
  });
}

function editTaskContent(id, contentEl) {
  const currentText = contentEl.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentText;
  input.className = 'task-edit-input';
  contentEl.replaceWith(input);
  input.focus();
  input.select();
  function save() {
    const newContent = input.value.trim();
    if (newContent && newContent !== currentText) {
      dbGet('tasks', id).then(function(task) {
        if (task) {
          task.content = newContent;
          return dbPut('tasks', task);
        }
      }).then(function() {
        loadAndRenderTasks();
      });
    } else {
      loadAndRenderTasks();
    }
  }
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { input.value = currentText; input.blur(); }
  });
  input.addEventListener('blur', save);
}

function deleteTask(id) {
  let deletedTask = null;
  return dbGet('tasks', id).then(function(task) {
    deletedTask = task;
    return dbDelete('tasks', id);
  }).then(function() {
    return loadAndRenderTasks();
  }).then(function() {
    showUndoBar('已删除任务: ' + (deletedTask ? deletedTask.content : ''), function() {
      if (deletedTask) {
        dbAdd('tasks', deletedTask).then(function() {
          loadAndRenderTasks();
          showToast('已恢复');
        });
      }
    });
  });
}

function renderMediaCalendar() {
  const year = window._mediaCalendarYear;
  const month = window._mediaCalendarMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = todayStr();

  dbGetAll('media').then(function(all) {
    const publishDates = {};
    all.forEach(function(m) {
      if (m.publishDate && (m.status === 'published' || m.status === 'scheduled')) {
        publishDates[m.publishDate] = m;
      }
    });

    const weekdays = ['日','一','二','三','四','五','六'];
    let html = '<div class="media-calendar">' +
      '<div class="media-cal-header">' +
        '<button id="mediaPrevMonth">‹</button>' +
        '<span style="font-weight:600;">' + year + '年' + (month + 1) + '月</span>' +
        '<button id="mediaNextMonth">›</button>' +
      '</div>' +
      '<div class="media-cal-grid" style="margin-bottom:4px;">' +
        weekdays.map(function(w) { return '<div class="media-cal-weekday">' + w + '</div>'; }).join('') +
      '</div>' +
      '<div class="media-cal-grid">';

    // Previous month days
    const prevMonthLastDay = new Date(year, month, 0).getDate();
    for (let i = startWeekday - 1; i >= 0; i--) {
      html += '<div class="media-cal-cell other-month">' + (prevMonthLastDay - i) + '</div>';
    }
    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      let cls = 'media-cal-cell';
      if (ds === today) cls += ' today';
      if (publishDates[ds]) {
        cls += publishDates[ds].status === 'published' ? ' has-publish' : ' has-scheduled';
      }
      html += '<div class="' + cls + '" data-date="' + ds + '">' + d + '</div>';
    }
    // Next month days
    const totalCells = startWeekday + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      html += '<div class="media-cal-cell other-month">' + i + '</div>';
    }
    html += '</div></div>';

    const container = document.getElementById('mediaTabCalendar');
    container.innerHTML = html;

    document.getElementById('mediaPrevMonth').addEventListener('click', function() {
      window._mediaCalendarMonth--;
      if (window._mediaCalendarMonth < 0) { window._mediaCalendarMonth = 11; window._mediaCalendarYear--; }
      renderMediaCalendar();
    });
    document.getElementById('mediaNextMonth').addEventListener('click', function() {
      window._mediaCalendarMonth++;
      if (window._mediaCalendarMonth > 11) { window._mediaCalendarMonth = 0; window._mediaCalendarYear++; }
      renderMediaCalendar();
    });
    container.querySelectorAll('.media-cal-cell[data-date]').forEach(function(cell) {
      cell.addEventListener('click', function() {
        const ds = cell.dataset.date;
        const m = publishDates[ds];
        if (m) {
          showToast(m.title + ' (' + (MEDIA_STATUS[m.status] || {}).label + ')');
        } else {
          openMediaModal(null, ds);
        }
      });
    });
  });
}

let _currentQuoteIndex = -1;

function getDailyQuoteIndex() {
  // 使用日期作为种子，确保同一天显示同一句
  const today = todayStr();
  let hash = 0;
  for (let i = 0; i < today.length; i++) {
    hash = ((hash << 5) - hash) + today.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash) % DAILY_QUOTES.length;
}

function loadDailyQuote() {
  if (_currentQuoteIndex < 0) {
    _currentQuoteIndex = getDailyQuoteIndex();
  }
  const quote = DAILY_QUOTES[_currentQuoteIndex];
  const enEl = document.getElementById('quoteEn');
  const cnEl = document.getElementById('quoteCn');
  if (enEl) enEl.textContent = '"' + quote.en + '"';
  if (cnEl) cnEl.textContent = '—— ' + quote.cn + (quote.author ? '（' + quote.author + '）' : '');

  const refreshBtn = document.getElementById('quoteRefresh');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function() {
      // 随机换一句（不与当前重复）
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * DAILY_QUOTES.length);
      } while (newIndex === _currentQuoteIndex && DAILY_QUOTES.length > 1);
      _currentQuoteIndex = newIndex;
      loadDailyQuote();
    });
  }
}

function getWeekDates(offset) {
  offset = offset || 0;
  const now = new Date();
  const dayOfWeek = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek + 1 + offset * 7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'));
  }
  return dates;
}

function renderEnglishWeekCalendar() {
  const calendar = document.getElementById('engWeekCalendar');
  const offset = window._englishWeekOffset || 0;
  const dates = getWeekDates(offset);
  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const today = todayStr();
  const selected = window._englishSelectedDate;

  calendar.innerHTML = dates.map(function(ds, i) {
    const d = new Date(ds + 'T00:00:00');
    const isToday = ds === today;
    const isSelected = ds === selected;
    return '<div class="week-day-cell ' + (isToday ? 'today' : '') + ' ' + (isSelected ? 'active' : '') + '" data-date="' + ds + '">' +
      '<div class="day-name">' + dayNames[i] + '</div>' +
      '<div class="day-num">' + d.getDate() + '</div>' +
      '<div class="day-mark" id="eng-mark-' + ds + '"></div>' +
      '</div>';
  }).join('');

  calendar.querySelectorAll('.week-day-cell').forEach(function(cell) {
    cell.addEventListener('click', function() {
      window._englishSelectedDate = cell.dataset.date;
      renderEnglish();
    });
  });
}

function loadEnglishDayTasks() {
  const selectedDate = window._englishSelectedDate;
  document.getElementById('engSelectedDate').textContent = formatDateCN(selectedDate);
  const listEl = document.getElementById('engTaskList');

  dbGetAll('english').then(function(all) {
    const dayTasks = all.filter(function(t) { return t.date === selectedDate; });
    dayTasks.sort(function(a, b) { return a.createdAt - b.createdAt; });

    if (dayTasks.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="icon">📖</div>这一天还没有学习任务</div>';
    } else {
      const typeIcons = { vocabulary: '📚', reading: '📖', listening: '🎧', writing: '✍️', speaking: '🗣️', other: '📝' };
      listEl.innerHTML = dayTasks.map(function(t) {
        return '<div class="english-task-item ' + (t.completed ? 'completed' : '') + '" data-id="' + t.id + '">' +
          '<input type="checkbox" class="task-checkbox" ' + (t.completed ? 'checked' : '') + '>' +
          '<span class="type-icon">' + (typeIcons[t.type] || '📝') + '</span>' +
          '<span class="content">' + escapeHtml(t.content) + '</span>' +
          (t.duration ? '<span class="duration">' + t.duration + '分钟</span>' : '') +
          '<button class="task-edit-btn" title="编辑" style="opacity:1;margin-right:4px;">✎</button>' +
          '<button class="task-delete-btn" style="opacity:1;">✕</button>' +
          '</div>';
      }).join('');

      listEl.querySelectorAll('.english-task-item').forEach(function(item) {
        const id = item.dataset.id;
        item.querySelector('.task-checkbox').addEventListener('change', function() {
          toggleEnglishTask(id, this.checked);
        });
        item.querySelector('.content').addEventListener('dblclick', function() {
          editEnglishTaskInline(id, item);
        });
        item.querySelector('.task-edit-btn').addEventListener('click', function() {
          editEnglishTaskInline(id, item);
        });
        item.querySelector('.task-delete-btn').addEventListener('click', function() {
          deleteEnglishTask(id);
        });
      });
    }

    // Update calendar marks
    const byDate = {};
    all.forEach(function(t) {
      if (!byDate[t.date]) byDate[t.date] = { total: 0, done: 0 };
      byDate[t.date].total++;
      if (t.completed) byDate[t.date].done++;
    });
    getWeekDates(window._englishWeekOffset || 0).forEach(function(ds) {
      const mark = document.getElementById('eng-mark-' + ds);
      if (mark && byDate[ds]) {
        mark.textContent = byDate[ds].done + '/' + byDate[ds].total;
      }
    });
  });
}

    const todayDs = todayStr();
    const todayTasks = byDate[todayDs] || [];
    if (!todayTasks.some(function(t) { return t.completed; })) {
      d.setDate(d.getDate() - 1);
    }
    while (true) {
      const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const tasks = byDate[ds] || [];
      if (tasks.some(function(t) { return t.completed; })) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    document.getElementById('engStreak').textContent = streak;

    // Week stats
    const weekDates = getWeekDates();
    const weekTasks = all.filter(function(t) { return weekDates.indexOf(t.date) > -1; });
    const weekTotal = weekTasks.length;
    const weekDone = weekTasks.filter(function(t) { return t.completed; }).length;
    const weekRate = weekTotal > 0 ? Math.round(weekDone / weekTotal * 100) : 0;
    document.getElementById('engWeekRate').textContent = weekRate + '%';
    document.getElementById('engWeekTotal').textContent = weekTotal;

    // 近7天完成率趋势
    const trendChart = document.getElementById('engTrendChart');
    if (trendChart) {
      let trendHTML = '';
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const ds = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
        const dayTasks = byDate[ds] || [];
        const dayTotal = dayTasks.length;
        const dayDone = dayTasks.filter(function(t) { return t.completed; }).length;
        const dayRate = dayTotal > 0 ? Math.round(dayDone / dayTotal * 100) : 0;
        const barHeight = Math.max(dayRate, 5);
        const isToday = i === 0;
        trendHTML += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
          '<div style="font-size:10px;color:var(--text-light);">' + (dayTotal > 0 ? dayRate + '%' : '-') + '</div>' +
          '<div style="width:100%;height:' + barHeight + 'px;background:' + (isToday ? 'linear-gradient(to top,#4fc3f7,#29b6f6)' : 'linear-gradient(to top,rgba(79,195,247,0.4),rgba(79,195,247,0.6))') + ';border-radius:4px 4px 0 0;min-height:4px;"></div>' +
          '<div style="font-size:10px;color:' + (isToday ? '#4fc3f7' : 'var(--text-light)') + ';">' + (date.getMonth()+1) + '/' + date.getDate() + '</div>' +
        '</div>';
      }
      trendChart.innerHTML = trendHTML;
    }
  });
}

// 通用：从文本中提取并解析JSON对象（从最长子串开始尝试）
function extractJsonFromText(text) {
  if (!text) return null;
  let cleaned = text.trim().replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '').trim();
  // 直接解析
  try {
    if (cleaned.startsWith('{') || cleaned.startsWith('[')) return JSON.parse(cleaned);
  } catch(e) {}
  // 用括号深度匹配找到完整的JSON对象
  const start = cleaned.search(/[\[{]/);
  if (start < 0) return null;
  const openChar = cleaned[start];
  const closeChar = openChar === '{' ? '}' : ']';
  let depth = 0, inString = false, escape = false;
  for (let i = start; i < cleaned.length; i++) {
    const ch = cleaned[i];
    if (escape) { escape = false; continue; }
    if (ch === '\\') { escape = true; continue; }
    if (ch === '"') { inString = !inString; continue; }
    if (inString) continue;
    if (ch === openChar) depth++;
    else if (ch === closeChar) {
      depth--;
      if (depth === 0) {
        let jsonStr = cleaned.slice(start, i + 1);
        // 尝试直接解析
        try {
          const parsed = JSON.parse(jsonStr);
          if (parsed && (parsed.plan || Array.isArray(parsed))) return parsed;
        } catch(e) {}
        // 尝试修复常见JSON错误
        try {
          let fixed = jsonStr
            .replace(/,\s*([}\]])/g, '$1')  // 去掉尾逗号
            .replace(/'/g, '"')              // 单引号转双引号（可能破坏内容，但作为fallback）
            .replace(/\n/g, ' ')             // 换行转空格
            .replace(/\t/g, ' ');
          const parsed = JSON.parse(fixed);
          if (parsed && (parsed.plan || Array.isArray(parsed))) return parsed;
        } catch(e) {}
        break;
      }
    }
  }
  // 最后手段：用正则提取所有 day/tasks 块手动组装
  if (text.includes('"day"') && text.includes('"tasks"')) {
    try {
      const plan = [];
      const dayBlocks = text.match(/\{"day"\s*:\s*\d+\s*,\s*"tasks"\s*:\s*\[.*?\]\s*\}/g) || [];
      for (const block of dayBlocks) {
        try {
          const dayMatch = block.match(/"day"\s*:\s*(\d+)/);
          const tasksMatch = block.match(/"tasks"\s*:\s*\[(.*)\]/);
          if (dayMatch && tasksMatch) {
            const day = parseInt(dayMatch[1]);
            const tasks = [];
            const taskBlocks = tasksMatch[1].match(/\{[^{}]*\}/g) || [];
            for (const tb of taskBlocks) {
              const typeMatch = tb.match(/"type"\s*:\s*"([^"]*)"/);
              const contentMatch = tb.match(/"content"\s*:\s*"([^"]*)"/);
              const durMatch = tb.match(/"duration"\s*:\s*(\d+)/);
              if (contentMatch) {
                tasks.push({
                  type: typeMatch ? typeMatch[1] : 'other',
                  content: contentMatch[1],
                  duration: durMatch ? parseInt(durMatch[1]) : 30
                });
              }
            }
            if (tasks.length > 0) plan.push({ day: day, tasks: tasks });
          }
        } catch(e) {}
      }
      if (plan.length > 0) return { plan: plan };
    } catch(e) {}
  }
  return null;
}

// 清理markdown标记
function cleanMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/###?\s*/g, '')
    .replace(/`(.+?)`/g, '$1')
    .replace(/\[(.+?)\]\(.+?\)/g, '$1')
    .replace(/^[-*•◦]\s+/gm, '')
    .replace(/^\d+[.、]\s+/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// 从文本中提取任务列表
function extractTasksFromText(text) {
  const tasks = [];
  if (!text) return tasks;
  const taskLines = text.match(/[-*•◦]\s+(.+)|^\d+[.、]\s+(.+)/gm) || [];
  for (const line of taskLines) {
    let content = line.replace(/^[-*•◦]\s+/, '').replace(/^\d+[.、]\s+/, '').trim();
    content = cleanMarkdown(content);
    if (content && content.length > 2 && content.length < 200) {
      if (/^(第.+天|阶段|Phase|核心原则|节奏|目标|说明)/.test(content)) continue;
      let type = 'other';
      if (/单词|词汇|vocab|word|背|高频词/.test(content)) type = 'vocabulary';
      else if (/阅读|read|reading|仔细阅读|长篇阅读|篇章|精读/.test(content)) type = 'reading';
      else if (/听力|listen|listening|精听|泛听|听写/.test(content)) type = 'listening';
      else if (/写作|作文|write|writing|翻译|translation|范文/.test(content)) type = 'writing';
      else if (/口语|speak|speaking|跟读|朗读/.test(content)) type = 'speaking';
      let duration = 30;
      const durMatch = content.match(/(\d+)\s*(分钟|min|minute)/i);
      if (durMatch) duration = parseInt(durMatch[1]);
      tasks.push({ type: type, content: content, duration: duration });
    }
  }
  if (tasks.length === 0) {
    const lines = text.split('\n').filter(function(l) {
      const t = l.trim();
      return t.length > 5 && t.length < 200 && !/^(第.+天|阶段|Phase|核心原则|节奏|目标|说明|###)/.test(t);
    });
    for (const line of lines.slice(0, 5)) {
      const content = cleanMarkdown(line.trim());
      if (content && content.length > 5) {
        let type = 'other';
        if (/单词|词汇|背/.test(content)) type = 'vocabulary';
        else if (/阅读|精读/.test(content)) type = 'reading';
        else if (/听力|精听/.test(content)) type = 'listening';
        else if (/写作|翻译/.test(content)) type = 'writing';
        let duration = 30;
        const durMatch = content.match(/(\d+)\s*(分钟|min)/i);
        if (durMatch) duration = parseInt(durMatch[1]);
        tasks.push({ type: type, content: content, duration: duration });
      }
    }
  }
  return tasks;
}

// 从AI回复中解析英语学习计划（支持按阶段分组）
function parseEnglishPlanFromText(reply) {
  if (!reply) return null;
  let data = null;
  data = extractJsonFromText(reply);
  if (!data || !data.plan) {
    const plan = [];
    const cleanedReply = cleanMarkdown(reply);
    // 识别阶段：前N天、第X-Y天、第X到第Y天
    const phaseRegex = /(?:前\s*(\d+)\s*天|第\s*(\d+)\s*[-~到至]\s*(\d+)\s*天|第\s*(\d+)\s*天到第\s*(\d+)\s*天)/gi;
    const phases = [];
    let pm;
    while ((pm = phaseRegex.exec(cleanedReply)) !== null) {
      let startDay, endDay;
      if (pm[1]) { startDay = 1; endDay = parseInt(pm[1]); }
      else if (pm[2]) { startDay = parseInt(pm[2]); endDay = parseInt(pm[3]); }
      else { startDay = parseInt(pm[4]); endDay = parseInt(pm[5]); }
      phases.push({ start: startDay, end: endDay, startIndex: pm.index });
    }
    // 识别 Day 标记
    const dayRegex = /(?:Day\s*(\d+)|day\s*(\d+)|第\s*(\d+|[一二三四五六七八九十]+)\s*天)/gi;
    const dayPositions = [];
    const chineseNumMap = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
    let dm;
    while ((dm = dayRegex.exec(cleanedReply)) !== null) {
      let dayNum = parseInt(dm[1] || dm[2] || dm[3]);
      if (isNaN(dayNum) && dm[3]) dayNum = chineseNumMap[dm[3]] || 1;
      dayPositions.push({ day: dayNum, start: dm.index });
    }
    // 情况1：有阶段 + 有Day标记
    if (phases.length > 0 && dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        let currentPhase = null;
        for (let j = phases.length - 1; j >= 0; j--) {
          if (phases[j].startIndex < dayInfo.start) { currentPhase = phases[j]; break; }
        }
        let globalDay = dayInfo.day;
        if (currentPhase && currentPhase.start !== null) globalDay = currentPhase.start + dayInfo.day - 1;
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        const tasks = extractTasksFromText(cleanedReply.slice(dayInfo.start, end));
        if (tasks.length > 0) plan.push({ day: globalDay, tasks: tasks });
      }
    }
    // 情况2：有阶段但没有Day标记 → 阶段内任务按天分配
    else if (phases.length > 0) {
      for (let i = 0; i < phases.length; i++) {
        const phase = phases[i];
        const end = i < phases.length - 1 ? phases[i+1].startIndex : cleanedReply.length;
        const phaseText = cleanedReply.slice(phase.startIndex, end);
        const tasks = extractTasksFromText(phaseText);
        if (tasks.length > 0 && phase.end >= phase.start) {
          const numDays = phase.end - phase.start + 1;
          for (let d = 0; d < numDays; d++) {
            const dayTasks = tasks.map(function(t, idx) {
              return { type: t.type, content: t.content, duration: t.duration };
            });
            plan.push({ day: phase.start + d, tasks: dayTasks });
          }
        }
      }
    }
    // 情况3：有Day标记但没有阶段
    else if (dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        const tasks = extractTasksFromText(cleanedReply.slice(dayInfo.start, end));
        if (tasks.length > 0) plan.push({ day: dayInfo.day, tasks: tasks });
      }
    }
    // 情况4：都没有，按段落分割（跳过标题）
    else {
      const sections = cleanedReply.split(/\n\n+/);
      let dayCount = 0;
      for (const section of sections) {
        const trimmed = section.trim();
        if (trimmed.length < 10) continue;
        // 跳过大标题和说明
        if (/^(一[、.．]|二[、.．]|三[、.．]|四[、.．]|五[、.．]|整体|核心原则|目标|说明|备注)/.test(trimmed)) continue;
        const tasks = extractTasksFromText(trimmed);
        if (tasks.length > 0) {
          dayCount++;
          plan.push({ day: dayCount, tasks: tasks });
        }
      }
    }
    if (plan.length > 0) data = { plan: plan };
  }
  return data;
}

// 保存英语计划到数据库（通用函数）
async function saveEnglishPlanToDB(data) {
  const today = new Date();
  let totalTasks = 0;
  for (const dayPlan of data.plan) {
    const dayOffset = dayPlan.day - 1;
    const date = new Date(today);
    date.setDate(today.getDate() + dayOffset);
    const dateStr = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
    for (const task of dayPlan.tasks) {
      await dbAdd('english', {
        id: genId(),
        date: dateStr,
        type: task.type || 'other',
        content: task.content || '学习任务',
        duration: task.duration || 30,
        completed: false,
        createdAt: Date.now(),
        aiGenerated: true
      });
      totalTasks++;
    }
  }
  return totalTasks;
}

async function generateEnglishAiPlan(goal, days, hours) {

学习目标：${goal}
备考天数：${days}天
每天可学习时间：${hours}小时

【重要】你的回复必须是一个纯JSON对象，不能包含任何其他文字、解释、markdown标记或代码块。直接以{开头，以}结尾。

JSON格式如下：
{"plan":[{"day":1,"tasks":[{"type":"vocabulary","content":"背50个六级核心词汇","duration":30},{"type":"listening","content":"精听1篇真题听力","duration":40}]},{"day":2,"tasks":[...]}]}

规则：

2. duration单位是分钟，每天任务总时长不超过${hours * 60}分钟
3. 任务内容要具体可执行
4. 必须覆盖${days}天，每天都要有任务

  try {

          '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn-primary" id="saveAsEnglishNote" style="padding:6px 14px;font-size:13px;">保存为学习笔记</button>' +
            '<button class="btn-secondary" id="retryEnglishPlan" style="padding:6px 14px;font-size:13px;">重新生成</button>' +
          '</div>',
        confirmText: '关闭',
        onConfirm: function() { return true; }
      });
      setTimeout(function() {
        const saveBtn = document.getElementById('saveAsEnglishNote');
        if (saveBtn) saveBtn.addEventListener('click', async function() {
          await dbAdd('english', {
            id: genId(), date: todayStr(), type: 'other',

            createdAt: Date.now(), aiGenerated: true
          });
          showToast('已保存为学习笔记', 'success');
          closeModal();
          renderEnglish();
        });
        const retryBtn = document.getElementById('retryEnglishPlan');

          showEnglishAiPlanForm();
        });

      const newContent = contentInput.value.trim();
      const newType = itemEl.querySelector('.eng-edit-type').value;
      const newDuration = parseInt(itemEl.querySelector('.eng-edit-duration').value) || null;
      if (!newContent) { showToast('内容不能为空', 'error'); return; }
      if (newDuration !== null && newDuration < 0) { showToast('时长不能为负数', 'error'); return; }
      task.content = newContent;
      task.type = newType;
      task.duration = newDuration;
      dbPut('english', task).then(function() {
        showToast('已更新');
        loadEnglishDayTasks();
        loadEnglishStats();
      });
    }
    itemEl.querySelector('.eng-edit-save').addEventListener('click', save);
    itemEl.querySelector('.eng-edit-cancel').addEventListener('click', function() { loadEnglishDayTasks(); });
    contentInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') loadEnglishDayTasks();
    });
  });
}

// ===== Experiment AI Extraction Engine =====
function extractExperimentInfo(text) {
  if (!text || typeof text !== 'string') return null;
  const result = {
    title: '',
    purpose: '',
    principle: '',
    steps: '',
    observations: '',
    results: '',
    conclusion: '',
    tags: []
  };

  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = normalized.split('\n');

  const sectionPatterns = [
    { key: 'purpose',      patterns: [/实验目的/, /目的要求/, /^目的[：:\s]/, /实验目标/, /实验任务/] },
    { key: 'principle',    patterns: [/实验原理/, /基本原理/, /^原理[：:\s]/, /方法原理/] },
    { key: 'steps',        patterns: [/实验步骤/, /操作步骤/, /实验方法/, /实验过程/, /^步骤[：:\s]/, /实验内容/, /操作方法/] },
    { key: 'observations', patterns: [/实验现象/, /^现象[：:\s]/, /观察记录/, /实验现象与记录/] },
    { key: 'results',      patterns: [/实验结果/, /^结果[：:\s]/, /实验数据/, /数据记录/, /结果与数据/] },
    { key: 'conclusion',   patterns: [/实验结论/, /^结论[：:\s]/, /结果分析/, /分析与讨论/, /讨论/, /实验讨论/] }
  ];

  // 1. 提取标题：先找"实验名称/题目/标题"关键词
  for (let i = 0; i < Math.min(lines.length, 15); i++) {
    const line = lines[i].trim();
    const titleMatch = line.match(/(?:实验名称|实验题目|实验标题|题目|报告题目)[：:\s]*(.+)/);
    if (titleMatch && titleMatch[1].trim()) {
      result.title = titleMatch[1].trim().replace(/[。.；;]+$/, '');
      break;
    }
  }
  // 兜底：用第一行有意义的非空行
  if (!result.title) {
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed && trimmed.length > 2 && trimmed.length < 120 && !/^[#=\-*_]+$/.test(trimmed)) {
        const isSection = sectionPatterns.some(s => s.patterns.some(p => p.test(trimmed)));
        if (!isSection && !/^(姓名|学号|班级|日期|指导教师|成绩)[：:]/.test(trimmed)) {
          result.title = trimmed.replace(/^[#\d.\s、]+/, '').replace(/[。.；;]+$/, '');
          break;
        }
      }
    }
  }

  // 2. 按章节提取各字段内容
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    if (!trimmed) continue;

    for (const section of sectionPatterns) {
      let matched = false;
      for (const pattern of section.patterns) {
        if (pattern.test(trimmed)) { matched = true; break; }
      }
      if (!matched) continue;

      // 同一行可能紧跟内容
      let content = '';
      let inlineRest = trimmed;
      for (const pattern of section.patterns) {
        inlineRest = inlineRest.replace(pattern, '');
      }
      inlineRest = inlineRest.replace(/^[：:\s]+/, '');
      if (inlineRest) content = inlineRest + '\n';

      // 收集后续行直到下一个章节或连续空行
      let j = i + 1;
      let emptyCount = 0;
      while (j < lines.length) {
        const nextLine = lines[j].trim();
        const isNextSection = sectionPatterns.some(s =>
          s.key !== section.key && s.patterns.some(p => p.test(nextLine))
        );
        if (isNextSection) break;
        if (!nextLine) {
          emptyCount++;
          if (emptyCount > 1 && content.trim()) break;
          j++;
          continue;
        }
        emptyCount = 0;
        // 排除页眉页脚类信息
        if (/^(姓名|学号|班级|日期|指导教师|成绩|第\s*\d+\s*页)/.test(nextLine)) { j++; continue; }
        content += nextLine + '\n';
        j++;
      }
      const trimmedContent = content.trim().split('\n').map(function(line) {
        return line.replace(/^[一二三四五六七八九十\d]+[、.．\s]+/, '');
      }).join('\n').trim();
      if (trimmedContent) {
        result[section.key] = result[section.key]
          ? result[section.key] + '\n' + trimmedContent
          : trimmedContent;
      }
      break;
    }
  }

  // 3. 智能标签提取（基于学科关键词）
  const tagKeywords = {
    '分析化学': ['滴定', '色谱', '光谱', '分光光度', 'HPLC', 'GC', 'UV', 'IR', 'NMR', '质谱', '重量分析', '容量分析', 'EDTA', '高锰酸钾', '碘量', '吸光度', '标准曲线', '标定'],
    '有机化学': ['酯化', '蒸馏', '回流', '萃取', '重结晶', '醛', '酮', '羧酸', '醇', '苯环', '取代反应', '加成反应', '乙酰化', '缩合'],
    '无机化学': ['配位化合物', '氧化还原', '沉淀反应', '电解', '原电池', '金属离子', '非金属', '缓冲溶液'],
    '生物化学': ['酶', '蛋白质', 'DNA', 'RNA', '氨基酸', '电泳', '离心', 'PCR', '发酵', '比色', ' Bradford'],
    '微生物学': ['细菌', '真菌', '培养', '灭菌', '接种', '革兰氏', '菌落', '培养基', '无菌操作', '划线'],
    '制药工程': ['制剂', '片剂', '胶囊', '颗粒剂', '注射剂', '软膏', '提取', '浓缩', '干燥', '制粒', '压片', '崩解', '溶出度'],
    '物理化学': ['热力学', '动力学', '相图', '电化学', '表面张力', '粘度', '渗透压', '燃烧热', '电导'],
    '物理': ['牛顿', '电磁感应', '光学', '力学', '波动', '加速度', '动量']
  };

  const textLower = normalized.toLowerCase();
  for (const tag in tagKeywords) {
    const keywords = tagKeywords[tag];
    for (let k = 0; k < keywords.length; k++) {
      if (textLower.indexOf(keywords[k].toLowerCase()) > -1) {
        if (result.tags.indexOf(tag) === -1) result.tags.push(tag);
        break;
      }
    }
  }
  if (result.tags.length === 0 && /实验|测定|合成|制备|分析/.test(normalized)) {
    result.tags.push('实验');
  }

  return result;
}

function readTextFile(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) { resolve(e.target.result); };
    reader.onerror = function() { reject(reader.error); };
    reader.readAsText(file, 'UTF-8');
  });
}

function isTextFile(file) {
  const textExts = ['.txt', '.md', '.csv', '.json', '.xml', '.html', '.htm', '.log', '.rtf'];
  const name = (file.name || '').toLowerCase();
  return textExts.some(function(ext) { return name.endsWith(ext); }) ||
         (file.type && file.type.indexOf('text/') === 0) ||
         file.type === 'application/json' ||
         file.type === 'application/xml';
}

function isWordFile(file) {
  const name = (file.name || '').toLowerCase();
  return name.endsWith('.docx') || name.endsWith('.doc') ||
         file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' ||
         file.type === 'application/msword';
}

function isParseableFile(file) {
  return isTextFile(file) || isWordFile(file);
}

// ===== .docx Parser (ZIP + XML text extraction) =====
function parseDocx(arrayBuffer) {
  return new Promise(function(resolve, reject) {
    try {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);

      // 1. Find End of Central Directory Record (PK\x05\x06)
      let eocdOffset = -1;
      const maxSearch = Math.min(bytes.length - 22, bytes.length);
      for (let i = maxSearch; i >= 0; i--) {
        if (bytes[i] === 0x50 && bytes[i+1] === 0x4b && bytes[i+2] === 0x05 && bytes[i+3] === 0x06) {
          eocdOffset = i;
          break;
        }
      }
      if (eocdOffset === -1) { reject(new Error('不是有效的ZIP文件（未找到EOCD）')); return; }

      const cdOffset = view.getUint32(eocdOffset + 16, true);
      const cdSize = view.getUint32(eocdOffset + 12, true);
      const cdEntries = view.getUint16(eocdOffset + 10, true);

      // 2. Parse Central Directory to find word/document.xml
      let docEntry = null;
      let pos = cdOffset;
      for (let e = 0; e < cdEntries && pos < cdOffset + cdSize; e++) {
        if (bytes[pos] !== 0x50 || bytes[pos+1] !== 0x4b || bytes[pos+2] !== 0x01 || bytes[pos+3] !== 0x02) break;
        const compMethod = view.getUint16(pos + 10, true);
        const compSize = view.getUint32(pos + 20, true);
        const uncompSize = view.getUint32(pos + 24, true);
        const nameLen = view.getUint16(pos + 28, true);
        const extraLen = view.getUint16(pos + 30, true);
        const commentLen = view.getUint16(pos + 32, true);
        const localHeaderOffset = view.getUint32(pos + 42, true);
        const fileName = String.fromCharCode.apply(null, bytes.subarray(pos + 46, pos + 46 + nameLen));

        if (fileName === 'word/document.xml') {
          docEntry = { compMethod: compMethod, compSize: compSize, uncompSize: uncompSize, localHeaderOffset: localHeaderOffset };
          break;
        }
        pos += 46 + nameLen + extraLen + commentLen;
      }

      if (!docEntry) { reject(new Error('docx中未找到word/document.xml')); return; }

      // 3. Read Local File Header to find data offset
      const lhSig = view.getUint32(docEntry.localHeaderOffset, true);
      if (lhSig !== 0x04034b50) { reject(new Error('无效的Local File Header')); return; }
      const lhNameLen = view.getUint16(docEntry.localHeaderOffset + 26, true);
      const lhExtraLen = view.getUint16(docEntry.localHeaderOffset + 28, true);
      const dataOffset = docEntry.localHeaderOffset + 30 + lhNameLen + lhExtraLen;
      const compressedData = bytes.subarray(dataOffset, dataOffset + docEntry.compSize);

      // 4. Decompress if needed
      function extractText(xmlText) {
        // Simple XML text extraction: get text from <w:t> elements
        let text = '';
        const regex = /<w:t[^>]*>([\s\S]*?)<\/w:t>/g;
        let match;
        let lastEnd = 0;
        while ((match = regex.exec(xmlText)) !== null) {
          // Add paragraph break if there's a <w:p> between matches
          const between = xmlText.substring(lastEnd, match.index);
          if (lastEnd > 0 && between.indexOf('<w:p') > -1) text += '\n';
          text += match[1];
          lastEnd = regex.lastIndex;
        }
        // Decode XML entities
        text = text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'");
        return text;
      }

      if (docEntry.compMethod === 0) {
        // STORE - no compression
        const xmlText = new TextDecoder('utf-8').decode(compressedData);
        resolve(extractText(xmlText));
      } else if (docEntry.compMethod === 8) {
        // DEFLATE - use DecompressionStream
        const stream = new Blob([compressedData]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        const reader = stream.getReader();
        const chunks = [];
        function pump() {
          reader.read().then(function(result) {
            if (result.done) {
              const all = new Uint8Array(chunks.reduce(function(s, c) { return s + c.length; }, 0));
              let offset = 0;
              chunks.forEach(function(c) { all.set(c, offset); offset += c.length; });
              const xmlText = new TextDecoder('utf-8').decode(all);
              resolve(extractText(xmlText));
            } else {
              chunks.push(result.value);
              pump();
            }
          }).catch(reject);
        }
        pump();
      } else {
        reject(new Error('不支持的压缩方法: ' + docEntry.compMethod));
      }
    } catch (e) {
      reject(e);
    }
  });
}

// ===== .doc Text Extraction (binary OLE - UTF-16LE string scanning) =====
function extractTextFromDoc(arrayBuffer) {
  try {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    const strings = [];
    let current = [];
    const minLen = 4;

    // Scan for UTF-16LE encoded printable strings
    for (let i = 0; i + 1 < bytes.length; i += 2) {
      const code = view.getUint16(i, true);
      // Printable: CJK (0x4E00-0x9FFF), ASCII printable (0x20-0x7E), common punctuation, newline
      const isPrintable = (code >= 0x20 && code <= 0x7E) ||
                          (code >= 0x4E00 && code <= 0x9FFF) ||
                          (code >= 0x3000 && code <= 0x303F) || // CJK punctuation
                          (code >= 0xFF00 && code <= 0xFFEF) || // Fullwidth
                          code === 0x000A || code === 0x000D || // newline
                          (code >= 0x0080 && code <= 0x00FF);   // Latin-1 supplement
      if (isPrintable && code !== 0x0000) {
        current.push(code);
      } else {
        if (current.length >= minLen) {
          strings.push(String.fromCharCode.apply(null, current));
        }
        current = [];
      }
    }
    if (current.length >= minLen) {
      strings.push(String.fromCharCode.apply(null, current));
    }

    // Filter and join: keep strings that look like document content
    const meaningful = strings.filter(function(s) {
      // Remove very short or pure garbage
      if (s.length < 4) return false;
      // Must contain at least one CJK char or 3+ ASCII letters
      const cjkCount = (s.match(/[\u4e00-\u9fff]/g) || []).length;
      const letterCount = (s.match(/[a-zA-Z]/g) || []).length;
      return cjkCount >= 1 || letterCount >= 3;
    });

    return meaningful.join('\n');
  } catch (e) {
    return '';
  }
}

function readFileAsArrayBuffer(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) { resolve(e.target.result); };
    reader.onerror = function() { reject(reader.error); };
    reader.readAsArrayBuffer(file);
  });
}

function extractTextFromFile(file) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.docx')) {
    return readFileAsArrayBuffer(file).then(parseDocx);
  } else if (name.endsWith('.doc')) {
    return readFileAsArrayBuffer(file).then(function(buf) { return extractTextFromDoc(buf); });
  } else {
    return readTextFile(file);
  }
}

function renderExperiments() {
  const container = document.getElementById('page-experiments');
  container.innerHTML =
    '<div class="exp-toolbar">' +
      '<input type="text" class="exp-search" id="expSearchInput" placeholder="🔍 搜索实验标题、目的、标签...">' +
    '</div>' +
    '<div class="exp-tag-filter" id="expTagFilter"></div>' +
    '<div id="expListView"></div>' +
    '<div id="expDetailView" style="display:none;"></div>';

  window._expSearchQuery = '';
  window._expActiveTag = null;
  window._expCurrentId = null;

  document.getElementById('expSearchInput').addEventListener('input', function() {
    window._expSearchQuery = this.value.toLowerCase();
    renderExpList();
  });

  renderExpTagFilter();
  renderExpList();

  const addBtn = document.getElementById('topbarAddBtn');

function renderExpTagFilter() {
  dbGetAll('experiments').then(function(all) {
    const tagSet = {};
    all.forEach(function(exp) {
      (exp.tags || []).forEach(function(t) { tagSet[t] = true; });
    });
    const tags = Object.keys(tagSet);
    const container = document.getElementById('expTagFilter');
    if (tags.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML =
      '<button class="exp-tag-btn ' + (window._expActiveTag === null ? 'active' : '') + '" data-tag="">全部</button>' +
      tags.map(function(t) {
        return '<button class="exp-tag-btn ' + (window._expActiveTag === t ? 'active' : '') + '" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
      }).join('');
    container.querySelectorAll('.exp-tag-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        window._expActiveTag = btn.dataset.tag || null;
        renderExpTagFilter();
        renderExpList();
      });
    });
  });
}

function renderExpList() {
  const searchQuery = window._expSearchQuery;
  const activeTag = window._expActiveTag;
  dbGetAll('experiments').then(function(all) {
    let filtered = all;
    if (activeTag) filtered = filtered.filter(function(exp) { return (exp.tags || []).indexOf(activeTag) > -1; });
    if (searchQuery) {
      filtered = filtered.filter(function(exp) {
        return (exp.title || '').toLowerCase().indexOf(searchQuery) > -1 ||
               (exp.purpose || '').toLowerCase().indexOf(searchQuery) > -1 ||
               (exp.tags || []).some(function(t) { return t.toLowerCase().indexOf(searchQuery) > -1; });
      });
    }
    filtered.sort(function(a, b) { return new Date(b.date || 0) - new Date(a.date || 0); });
    const container = document.getElementById('expListView');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🔬</div>没有匹配的实验记录</div>';
      return;
    }
    container.innerHTML = '<div class="exp-list">' + filtered.map(function(exp) {
      return '<div class="exp-item" data-id="' + exp.id + '">' +
        '<div class="exp-header">' +
          '<span class="exp-title">' + escapeHtml(exp.title) + '</span>' +
          '<span class="exp-date">' + (exp.date || '') + '</span>' +
        '</div>' +
        (exp.purpose ? '<div class="exp-purpose">' + escapeHtml(exp.purpose.slice(0, 100)) + (exp.purpose.length > 100 ? '...' : '') + '</div>' : '') +
        '<div class="exp-tags">' +
          (exp.tags || []).map(function(t) { return '<span class="exp-tag">' + escapeHtml(t) + '</span>'; }).join('') +
          '<span class="exp-file-count">📎 ' + ((exp.fileIds || []).length) + ' 个文件</span>' +
        '</div>' +
        '</div>';
    }).join('') + '</div>';

    container.querySelectorAll('.exp-item').forEach(function(item) {
      item.addEventListener('click', function() { openExpDetail(item.dataset.id); });
    });
  });
}

function handleExpFileUpload(expId, files) {
  if (!files || files.length === 0) return;
  dbGet('experiments', expId).then(function(exp) {
    if (!exp) return;
    const uploadPromises = files.map(function(file) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const fileRecord = {
            id: genId(),
            name: file.name,
            type: file.type,
            size: file.size,
            data: e.target.result,
            uploadedAt: Date.now()
          };
          dbAdd('files', fileRecord).then(function() { resolve(fileRecord.id); });
        };
        reader.readAsArrayBuffer(file);
      });
    });
    Promise.all(uploadPromises).then(function(fileIds) {
      exp.fileIds = (exp.fileIds || []).concat(fileIds);
      exp.updatedAt = Date.now();
      dbPut('experiments', exp).then(function() {
        showToast('已上传 ' + fileIds.length + ' 个文件');
        openExpDetail(expId);
      });
    });
  });
}

function downloadExpFile(fileId) {
  dbGet('files', fileId).then(function(file) {
    if (!file) return;
    const blob = new Blob([file.data], { type: file.type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
}

function deleteExpFile(expId, fileId) {
  showConfirm({
    title: '删除文件',
    message: '确定删除这个文件吗？',
    danger: true,
    onConfirm: function() {
      dbGet('experiments', expId).then(function(exp) {
        if (!exp) return;
        exp.fileIds = (exp.fileIds || []).filter(function(id) { return id !== fileId; });
        exp.updatedAt = Date.now();
        return dbPut('experiments', exp);
      }).then(function() {
        return dbDelete('files', fileId);
      }).then(function() {

    }
  });
}

function handleNewExpFileUpload(files) {
  if (!files || files.length === 0) return;
  const statusEl = document.getElementById('aiExtractStatus');
  const nameEl = document.getElementById('uploadedFileName');
  window._newExpPendingFiles = files;

  const file = files[0];
  nameEl.style.display = 'block';
  nameEl.textContent = '📎 ' + file.name + ' (' + formatFileSize(file.size) + ')';

  if (!isParseableFile(file)) {
    statusEl.style.display = 'block';
    statusEl.style.color = 'var(--warning)';
    statusEl.textContent = '⚠️ 该文件格式不支持AI自动识别，请手动填写表单内容（文件仍会作为附件保存）';
    return;
  }

  statusEl.style.display = 'block';
  statusEl.style.color = 'var(--c-experiments)';
  statusEl.textContent = '🔍 AI正在识别提取实验信息...';

  extractTextFromFile(file).then(function(text) {
    const info = extractExperimentInfo(text);
    if (!info) {
      statusEl.style.color = 'var(--warning)';
      statusEl.textContent = '⚠️ 无法读取文件内容，请手动填写';
      return;
    }
    // 填充表单（仅填充空字段，不覆盖用户已输入的内容）
    const fillIfEmpty = function(id, value) {
      const el = document.getElementById(id);
      if (el && !el.value.trim() && value) el.value = value;
    };
    fillIfEmpty('expTitleInput', info.title);
    fillIfEmpty('expPurposeInput', info.purpose);
    fillIfEmpty('expPrincipleInput', info.principle);
    fillIfEmpty('expStepsInput', info.steps);
    fillIfEmpty('expObservationsInput', info.observations);
    fillIfEmpty('expResultsInput', info.results);
    fillIfEmpty('expConclusionInput', info.conclusion);
    if (info.tags && info.tags.length > 0) {
      const tagsEl = document.getElementById('expTagsInput');
      if (tagsEl && !tagsEl.value.trim()) tagsEl.value = info.tags.join(', ');
    }
    const extracted = ['title','purpose','principle','steps','observations','results','conclusion'].filter(function(k) { return info[k]; }).length;
    statusEl.style.color = 'var(--success)';
    statusEl.textContent = '✅ AI已提取 ' + extracted + ' 项信息，请核对后保存';
  }).catch(function() {
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = '❌ 文件读取失败，请手动填写';
  });
}

// 从AI回复解析健身计划
function parseWorkoutPlanFromText(reply) {
  if (!reply) return null;
  let data = null;
  data = extractJsonFromText(reply);
  if (!data || !data.plan) {
    const plan = [];
    const cleanedReply = cleanMarkdown(reply);
    // 识别阶段：前N天、第X-Y天
    const phaseRegex = /(?:前\s*(\d+)\s*天|第\s*(\d+)\s*[-~到至]\s*(\d+)\s*天|第\s*(\d+)\s*天到第\s*(\d+)\s*天|第\s*(\d+)\s*周)/gi;
    const phases = [];
    let pm;
    while ((pm = phaseRegex.exec(cleanedReply)) !== null) {
      let startDay, endDay;
      if (pm[1]) { startDay = 1; endDay = parseInt(pm[1]); }
      else if (pm[2]) { startDay = parseInt(pm[2]); endDay = parseInt(pm[3]); }
      else if (pm[4]) { startDay = parseInt(pm[4]); endDay = parseInt(pm[5]); }
      else if (pm[6]) { startDay = (parseInt(pm[6])-1)*7+1; endDay = parseInt(pm[6])*7; }
      phases.push({ start: startDay, end: endDay, startIndex: pm.index });
    }
    // 识别 Day 标记
    const dayRegex = /(?:Day\s*(\d+)|day\s*(\d+)|第\s*(\d+|[一二三四五六七八九十]+)\s*天|星期[一二三四五六日天]\s*训练)/gi;
    const dayPositions = [];
    const chineseNumMap = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '日':7, '天':7 };
    let dm;
    while ((dm = dayRegex.exec(cleanedReply)) !== null) {
      let dayNum = parseInt(dm[1] || dm[2] || dm[3]);
      if (isNaN(dayNum) && dm[3]) dayNum = chineseNumMap[dm[3]] || 1;
      dayPositions.push({ day: dayNum, start: dm.index });
    }
    const processDay = function(globalDay, start, end) {
      const dayText = cleanedReply.slice(start, end);
      let muscleGroup = '';
      const muscleMatch = dayText.match(/(胸|背|腿|肩|手臂|核心|有氧|休息|全身|推拉腿|推日|拉日|腿日)/);
      if (muscleMatch) muscleGroup = muscleMatch[1];
      const exerciseLines = dayText.match(/[-*•◦]\s+(.+)|^\d+[.、]\s+(.+)/gm) || [];
      const exercises = [];
      for (const line of exerciseLines) {
        let name = line.replace(/^[-*•◦]\s+/, '').replace(/^\d+[.、]\s+/, '').trim();
        name = cleanMarkdown(name);
        if (name && name.length > 1 && name.length < 80 && !/^(第.+天|阶段|Phase|核心原则|目标|说明|一[、.．]|二[、.．]|三[、.．])/.test(name)) {
          let sets = 3, reps = '12';
          const setsMatch = name.match(/(\d+)\s*组/);
          if (setsMatch) sets = parseInt(setsMatch[1]);
          const repsMatch = name.match(/(\d+)\s*(次|个|rep)/i);
          if (repsMatch) reps = repsMatch[1];
          exercises.push({ name: name, weight: null, sets: sets, reps: reps, notes: '' });
        }
      }
      if (muscleGroup || exercises.length > 0) {
        plan.push({ day: globalDay, muscleGroup: muscleGroup || '综合训练', duration: 60, exercises: exercises, notes: '' });
      }
    };
    // 情况1：有阶段 + 有Day标记
    if (phases.length > 0 && dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        let currentPhase = null;
        for (let j = phases.length - 1; j >= 0; j--) {
          if (phases[j].startIndex < dayInfo.start) { currentPhase = phases[j]; break; }
        }
        let globalDay = dayInfo.day;
        if (currentPhase && currentPhase.start !== null) globalDay = currentPhase.start + dayInfo.day - 1;
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        processDay(globalDay, dayInfo.start, end);
      }
    }
    // 情况2：有阶段但没有Day标记 → 阶段内任务按天分配
    else if (phases.length > 0) {
      for (let i = 0; i < phases.length; i++) {
        const phase = phases[i];
        const end = i < phases.length - 1 ? phases[i+1].startIndex : cleanedReply.length;
        const phaseText = cleanedReply.slice(phase.startIndex, end);
        
        // 先尝试识别阶段内的多个训练日（周一：胸、Day1：背等）
        const innerDayRegex = /(?:(周[一二三四五六日天]|星期[一二三四五六日天]|Day\s*\d+|day\s*\d+|第\s*\d+\s*天)\s*[:：]\s*(.+?)(?=\n(?:周[一二三四五六日天]|星期[一二三四五六日天]|Day\s*\d+|day\s*\d+|第\s*\d+\s*天)\s*[:：]|$))/gims;
        const innerDays = [];
        let im;
        while ((im = innerDayRegex.exec(phaseText)) !== null) {
          innerDays.push({ label: im[1], content: im[2] });
        }
        
        if (innerDays.length > 0) {
          // 阶段内有多个训练日，按顺序分配到阶段的每一天
          const numDays = phase.end - phase.start + 1;
          for (let d = 0; d < numDays; d++) {
            const dayInfo = innerDays[d % innerDays.length];
            const dayText = dayInfo.content;
            let muscleGroup = '综合训练';
            const muscleMatch = dayText.match(/(胸|背|腿|肩|手臂|核心|有氧|休息|全身|推拉腿|推日|拉日|腿日)/);
            if (muscleMatch) muscleGroup = muscleMatch[1];
            const exerciseLines = dayText.match(/[-*•◦]\s+(.+)|^\d+[.、]\s+(.+)/gm) || [];
            const exercises = [];
            for (const line of exerciseLines) {
              let name = line.replace(/^[-*•◦]\s+/, '').replace(/^\d+[.、]\s+/, '').trim();
              name = cleanMarkdown(name);
              if (name && name.length > 1 && name.length < 80 && !/^(第.+天|阶段|Phase|核心原则|目标|说明)/.test(name)) {
                let sets = 3, reps = '12';
                const setsMatch = name.match(/(\d+)\s*组/);
                if (setsMatch) sets = parseInt(setsMatch[1]);
                const repsMatch = name.match(/(\d+)\s*(次|个|rep)/i);
                if (repsMatch) reps = repsMatch[1];
                exercises.push({ name: name, weight: null, sets: sets, reps: reps, notes: '' });
              }
            }
            if (exercises.length > 0 || muscleGroup !== '综合训练') {
              plan.push({ day: phase.start + d, muscleGroup: muscleGroup, duration: 60, exercises: exercises, notes: '' });
            }
          }
        } else {
          // 阶段内没有明确的训练日，假设所有天训练内容相同
          const exerciseLines = phaseText.match(/[-*•◦]\s+(.+)|^\d+[.、]\s+(.+)/gm) || [];
          const phaseExercises = [];
          for (const line of exerciseLines) {
            let name = line.replace(/^[-*•◦]\s+/, '').replace(/^\d+[.、]\s+/, '').trim();
            name = cleanMarkdown(name);
            if (name && name.length > 1 && name.length < 80 && !/^(第.+天|阶段|Phase|核心原则|目标|说明|一[、.．]|二[、.．]|三[、.．])/.test(name)) {
              let sets = 3, reps = '12';
              const setsMatch = name.match(/(\d+)\s*组/);
              if (setsMatch) sets = parseInt(setsMatch[1]);
              const repsMatch = name.match(/(\d+)\s*(次|个|rep)/i);
              if (repsMatch) reps = repsMatch[1];
              phaseExercises.push({ name: name, weight: null, sets: sets, reps: reps, notes: '' });
            }
          }
          let muscleGroup = '综合训练';
          const muscleMatch = phaseText.match(/(胸|背|腿|肩|手臂|核心|有氧|休息|全身|推拉腿|推日|拉日|腿日)/);
          if (muscleMatch) muscleGroup = muscleMatch[1];
          if (phaseExercises.length > 0 && phase.end >= phase.start) {
            const numDays = phase.end - phase.start + 1;
            for (let d = 0; d < numDays; d++) {
              plan.push({
                day: phase.start + d,
                muscleGroup: muscleGroup,
                duration: 60,
                exercises: phaseExercises.map(function(e) { return { name: e.name, weight: null, sets: e.sets, reps: e.reps, notes: '' }; }),
                notes: ''
              });
            }
          }
        }
      }
    }
    // 情况3：有Day标记但没有阶段
    else if (dayPositions.length > 0) {
      for (let i = 0; i < dayPositions.length; i++) {
        const dayInfo = dayPositions[i];
        const end = i < dayPositions.length - 1 ? dayPositions[i+1].start : cleanedReply.length;
        processDay(dayInfo.day, dayInfo.start, end);
      }
    }
    // 情况4：都没有，按段落分割（跳过标题）
    else {
      const sections = cleanedReply.split(/\n\n+/);
      let dayCount = 0;
      for (const section of sections) {
        const trimmed = section.trim();
        if (trimmed.length < 10) continue;
        if (/^(一[、.．]|二[、.．]|三[、.．]|四[、.．]|五[、.．]|整体|核心原则|目标|说明|备注)/.test(trimmed)) continue;
        const oldLen = plan.length;
        processDay(1, 0, trimmed.length);
        if (plan.length > oldLen) {
          dayCount++;
          plan[plan.length-1].day = dayCount;
        }
      }
    }
    if (plan.length > 0) data = { plan: plan };
  }
  return data;
}

// 保存健身计划到数据库
async function saveWorkoutPlanToDB(data) {
  const today = new Date();
  let total = 0;
  for (const dayPlan of data.plan) {
    const dayOffset = dayPlan.day - 1;
    const date = new Date(today);
    date.setDate(today.getDate() + dayOffset);
    const dateStr = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
    await dbAdd('workouts', {
      id: genId(),
      date: dateStr,
      muscleGroup: dayPlan.muscleGroup || '综合训练',
      duration: dayPlan.duration || 60,
      exercises: dayPlan.exercises || [],
      notes: dayPlan.notes || '',
      createdAt: Date.now(),
      aiGenerated: true
    });
    total++;
  }
  return total;
}

{"plan":[
{"day":1,"muscleGroup":"胸部","duration":60,"exercises":[{"name":"杠铃卧推","sets":4,"reps":"8-10","notes":""},{"name":"哑铃飞鸟","sets":3,"reps":"12","notes":""},{"name":"上斜哑铃卧推","sets":3,"reps":"10","notes":""}]},

]}

规则：

        if (saveBtn) saveBtn.addEventListener('click', async function() {
          await dbAdd('workouts', {
            id: genId(), date: todayStr(), muscleGroup: 'AI生成',
            duration: 0, exercises: [], notes: reply.slice(0, 500),
            createdAt: Date.now(), aiGenerated: true
          });
          showToast('已保存为训练笔记', 'success');
          closeModal();

        });
        const retryBtn = document.getElementById('retryWorkoutPlan');
        if (retryBtn) retryBtn.addEventListener('click', function() {

function loadWorkoutCalendar() {
  const weekDates = getWeekDates(window._workoutWeekOffset || 0);
  const dayNames = ['一','二','三','四','五','六','日'];
  const selected = window._workoutSelectedDate;
  dbGetAll('workouts').then(function(workouts) {
    const workoutByDate = {};
    workouts.forEach(function(w) {
      if (!workoutByDate[w.date]) workoutByDate[w.date] = [];
      workoutByDate[w.date].push(w);
    });
    const calendar = document.getElementById('workoutCalendar');
    calendar.innerHTML = weekDates.map(function(ds, i) {
      const d = new Date(ds + 'T00:00:00');
      const dayWorkouts = workoutByDate[ds] || [];
      const hasWorkout = dayWorkouts.length > 0;
      const isSelected = ds === selected;
      // 汇总部位和动作
      const muscleGroups = dayWorkouts.map(function(w) { return w.muscleGroup; }).filter(function(g) { return g; });
      const allExercises = [];
      dayWorkouts.forEach(function(w) {
        (w.exercises || []).forEach(function(ex) {
          if (ex.name) allExercises.push(ex.name + (ex.sets ? '×' + ex.sets : ''));
        });
      });
      const summary = muscleGroups.length > 0
        ? muscleGroups.join('、')
        : (allExercises.length > 0 ? allExercises.slice(0, 2).join('、') : '');
      return '<div class="workout-day-cell ' + (hasWorkout ? 'has-workout' : '') + ' ' + (isSelected ? 'active' : '') + '" data-date="' + ds + '" style="min-height:80px;padding:8px 4px;">' +
        '<div class="day-name">周' + dayNames[i] + '</div>' +
        '<div class="day-num">' + d.getDate() + '</div>' +
        (hasWorkout ? '<div class="day-mark" style="font-size:10px;margin-top:4px;line-height:1.3;">' +
          (muscleGroups.length > 0 ? '💪 ' + escapeHtml(muscleGroups.slice(0, 2).join('、')) + (muscleGroups.length > 2 ? '...' : '') : '') +
          (allExercises.length > 0 ? '<br>' + allExercises.length + '个动作' : '') +
          '</div>' : '<div class="day-mark" style="font-size:10px;color:var(--text-light);margin-top:4px;">休息</div>') +
        '</div>';
    }).join('');
    calendar.querySelectorAll('.workout-day-cell').forEach(function(cell) {
      cell.addEventListener('click', function() {
        window._workoutSelectedDate = cell.dataset.date;
        loadWorkoutCalendar();
        loadWorkoutDetail();
      });
    });
  });
}

      return '<div class="workout-detail-card">' +
        '<div class="workout-detail-header">' +
          '<span class="muscle-group">' + escapeHtml(w.muscleGroup || '训练') + '</span>' +
          '<span class="duration">' + (w.duration ? w.duration + ' 分钟' : '') + '</span>' +
        '</div>' +
        '<table class="exercise-table">' +
          '<thead><tr><th>动作</th><th>重量</th><th>组数</th><th>次数</th><th>备注</th><th>操作</th></tr></thead>' +
          '<tbody>' + exercisesHtml + '</tbody>' +
        '</table>' +
        (w.notes ? '<div style="margin-top:10px;font-size:12px;color:var(--text-light);">备注：' + escapeHtml(w.notes) + '</div>' : '') +
        '</div>';
    }).join('');
  });
}

function calculatePRs(allWorkouts) {
  const prs = {};
  allWorkouts.forEach(function(w) {
    (w.exercises || []).forEach(function(ex) {
      if (ex.weight && (!prs[ex.name] || ex.weight > prs[ex.name])) {
        prs[ex.name] = ex.weight;
      }
    });
  });
  return prs;
}

function loadWorkoutStats() {
  dbGetAll('workouts').then(function(all) {
    const weekDates = getWeekDates();
    const weekCount = all.filter(function(w) { return weekDates.indexOf(w.date) > -1; }).length;
    document.getElementById('workoutWeekCount').textContent = weekCount;
    const prs = calculatePRs(all);
    document.getElementById('workoutPRCount').textContent = Object.keys(prs).length;

    // 近7天训练趋势
    const trendChart = document.getElementById('workoutTrendChart');
    if (trendChart) {
      const byDate = {};
      all.forEach(function(w) {
        if (!byDate[w.date]) byDate[w.date] = [];
        byDate[w.date].push(w);
      });
      let trendHTML = '';
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const ds = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
        const dayWorkouts = byDate[ds] || [];
        const hasWorkout = dayWorkouts.length > 0;
        const muscle = hasWorkout ? (dayWorkouts[0].muscleGroup || '训练') : '';
        const barHeight = hasWorkout ? 80 : 8;
        const isToday = i === 0;
        trendHTML += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
          '<div style="font-size:10px;color:var(--text-light);height:14px;">' + (hasWorkout ? muscle.slice(0,2) : '') + '</div>' +
          '<div style="width:100%;height:' + barHeight + 'px;background:' + (hasWorkout ? 'linear-gradient(to top,#ff9800,#ffb74d)' : 'rgba(255,152,0,0.15)') + ';border-radius:4px 4px 0 0;min-height:4px;"></div>' +
          '<div style="font-size:10px;color:' + (isToday ? '#ff9800' : 'var(--text-light)') + ';">' + (date.getMonth()+1) + '/' + date.getDate() + '</div>' +
        '</div>';
      }
      trendChart.innerHTML = trendHTML;
    }
  });
}

function openWorkoutModal(existing) {
  const isEdit = !!existing;
  let exerciseRows = existing && existing.exercises ? existing.exercises : [];

  function renderExerciseInputs() {
    return exerciseRows.map(function(ex, idx) {
      return '<div class="exercise-input-row" data-idx="' + idx + '">' +
        '<input type="text" class="ex-name" placeholder="动作名" value="' + escapeHtml(ex.name || '') + '">' +
        '<input type="number" class="ex-num ex-weight" placeholder="kg" value="' + (ex.weight || '') + '">' +
        '<input type="number" class="ex-num" placeholder="组" value="' + (ex.sets || '') + '">' +
        '<input type="number" class="ex-num" placeholder="次" value="' + (ex.reps || '') + '">' +
        '<input type="text" class="ex-num" style="flex:1;" placeholder="备注" value="' + escapeHtml(ex.notes || '') + '">' +
        '<button class="remove-ex-btn" data-idx="' + idx + '">×</button>' +
        '</div>';
    }).join('');
  }

  // 加载历史训练用于复用
  dbGetAll('workouts').then(function(allWorkouts) {
    // 按日期倒序，去重（按 muscleGroup+动作组合），取前 6 条
    const seen = {};
    const history = [];
    allWorkouts.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    allWorkouts.forEach(function(w) {
      if (!w.exercises || w.exercises.length === 0) return;
      const key = w.muscleGroup + '||' + w.exercises.map(function(e) { return e.name; }).join(',');
      if (seen[key]) return;
      seen[key] = true;
      history.push(w);
    });
    const recentHistory = history.slice(0, 6);
    let historyHtml = '';
    if (recentHistory.length > 0 && !isEdit) {
      historyHtml = '<div class="form-group"><label>历史训练复用（点击填充动作）</label>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">' +
        recentHistory.map(function(w, i) {
          return '<button type="button" class="btn history-workout-btn" data-idx="' + i + '" style="font-size:12px;padding:4px 10px;">' +
            escapeHtml(w.muscleGroup || '训练') + ' (' + w.date + ')' +
            '</button>';
        }).join('') +
        '</div></div>';
    }

    openModal({
      title: isEdit ? '编辑训练' : '记录训练',
      bodyHTML:
        '<div class="form-row">' +
          '<div class="form-group"><label>训练部位</label><input type="text" id="workoutMuscle" placeholder="例如：胸+三头" value="' + escapeHtml(existing ? (existing.muscleGroup || '') : '') + '"></div>' +
          '<div class="form-group"><label>时长(分钟)</label><input type="number" id="workoutDuration" placeholder="60" min="0" value="' + (existing ? (existing.duration || '') : '') + '"></div>' +
        '</div>' +
        historyHtml +
        '<div class="form-group"><label>动作列表</label>' +
          '<div id="exerciseInputs">' + renderExerciseInputs() + '</div>' +
          '<button class="btn" id="addExerciseBtn" style="margin-top:6px;">+ 添加动作</button>' +
        '</div>' +
        '<div class="form-group"><label>整体备注</label><textarea id="workoutNotes" placeholder="训练感受...">' + escapeHtml(existing ? (existing.notes || '') : '') + '</textarea></div>',
      onConfirm: function() {
        const muscleGroup = document.getElementById('workoutMuscle').value.trim();
        const duration = parseInt(document.getElementById('workoutDuration').value) || null;
        if (duration !== null && duration < 0) { showToast('时长不能为负数', 'error'); return false; }
        const notes = document.getElementById('workoutNotes').value.trim();
        const rows = document.querySelectorAll('#exerciseInputs .exercise-input-row');
        const exercises = [];
        rows.forEach(function(row) {
          const name = row.querySelector('.ex-name').value.trim();
          if (name) {
            const weight = parseFloat(row.querySelector('.ex-weight').value);
            exercises.push({
              name: name,
              weight: !isNaN(weight) && weight >= 0 ? weight : null,
              sets: parseInt(row.querySelectorAll('input')[2].value) || null,
              reps: parseInt(row.querySelectorAll('input')[3].value) || null,
              notes: row.querySelectorAll('input')[4].value.trim()
            });
          }
        });
        if (!muscleGroup && exercises.length === 0) {
          showToast('请输入训练部位或添加动作', 'error');
          return false;
        }
        if (isEdit) {
          existing.muscleGroup = muscleGroup;
          existing.duration = duration;
          existing.exercises = exercises;
          existing.notes = notes;
          dbPut('workouts', existing).then(function() { loadWorkoutCalendar(); loadWorkoutDetail(); loadWorkoutStats(); showToast('已更新'); });
        } else {
          dbAdd('workouts', {
            id: genId(), date: window._workoutSelectedDate,
            muscleGroup: muscleGroup, duration: duration,
            exercises: exercises, notes: notes, createdAt: Date.now()
          }).then(function() { loadWorkoutCalendar(); loadWorkoutDetail(); loadWorkoutStats(); showToast('已记录'); });
        }
      }
    });

    setTimeout(function() {
      const addBtn = document.getElementById('addExerciseBtn');
      if (addBtn) {
        addBtn.addEventListener('click', function() {
          exerciseRows.push({ name: '', weight: null, sets: null, reps: null, notes: '' });
          document.getElementById('exerciseInputs').innerHTML = renderExerciseInputs();
          bindRemoveButtons();
        });
      }
      bindRemoveButtons();
      // 绑定历史复用按钮
      document.querySelectorAll('.history-workout-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const idx = parseInt(btn.dataset.idx);
          const src = recentHistory[idx];
          if (!src) return;
          // 深拷贝动作列表
          exerciseRows = src.exercises.map(function(e) {
            return { name: e.name || '', weight: e.weight || null, sets: e.sets || null, reps: e.reps || null, notes: e.notes || '' };
          });
          // 自动填充训练部位
          const muscleInput = document.getElementById('workoutMuscle');
          if (muscleInput && !muscleInput.value.trim() && src.muscleGroup) {
            muscleInput.value = src.muscleGroup;
          }
          document.getElementById('exerciseInputs').innerHTML = renderExerciseInputs();
          bindRemoveButtons();
          showToast('已复用 ' + (src.muscleGroup || '训练') + ' 的动作');
        });
      });
    }, 50);

    function bindRemoveButtons() {
      document.querySelectorAll('#exerciseInputs .remove-ex-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const idx = parseInt(btn.dataset.idx);
          exerciseRows.splice(idx, 1);
          document.getElementById('exerciseInputs').innerHTML = renderExerciseInputs();
          bindRemoveButtons();
        });
      });
    }
  });
}

function loadMealsWeekCalendar() {
  const weekDates = getWeekDates();
  const dayNames = ['一','二','三','四','五','六','日'];
  const selected = window._mealsSelectedDate;
  dbGetAll('meals').then(function(all) {
    const mealsByDate = {};
    all.forEach(function(m) {
      if (!mealsByDate[m.date]) mealsByDate[m.date] = [];
      mealsByDate[m.date].push(m);
    });
    const calendar = document.getElementById('mealsWeekCalendar');
    if (!calendar) return;
    calendar.innerHTML = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;">' +
      weekDates.map(function(ds, i) {
        const d = new Date(ds + 'T00:00:00');
        const dayMeals = mealsByDate[ds] || [];
        const totalCal = dayMeals.reduce(function(sum, m) { return sum + (m.calories || 0); }, 0);
        const mealTypes = { breakfast: '早', lunch: '午', dinner: '晚', snack: '加' };
        const hasMeals = {};
        dayMeals.forEach(function(m) { hasMeals[m.mealType] = true; });
        const isSelected = ds === selected;
        const isToday = ds === todayStr();
        return '<div class="meals-cal-day ' + (isSelected ? 'selected' : '') + (isToday ? ' today' : '') + '" data-date="' + ds + '" style="background:var(--card);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer;box-shadow:var(--shadow);border:2px solid ' + (isSelected ? 'var(--c-meals)' : 'transparent') + ';min-height:75px;">' +
          '<div style="font-size:11px;color:var(--text-light);">周' + dayNames[i] + '</div>' +
          '<div style="font-size:15px;font-weight:700;margin:2px 0;">' + d.getDate() + '</div>' +
          (dayMeals.length > 0
            ? '<div style="font-size:10px;margin-top:2px;">' +
                Object.keys(mealTypes).filter(function(t) { return hasMeals[t]; }).map(function(t) { return mealTypes[t]; }).join('') +
              '</div>' +
              '<div style="font-size:11px;font-weight:600;color:var(--c-meals);margin-top:2px;">' + totalCal + 'kcal</div>'
            : '<div style="font-size:10px;color:var(--text-light);margin-top:4px;">未记录</div>') +
          '</div>';
      }).join('') +
      '</div>';
    calendar.querySelectorAll('.meals-cal-day').forEach(function(cell) {
      cell.addEventListener('click', function() {
        window._mealsSelectedDate = cell.dataset.date;
        renderMeals();
      });
    });
  });
}

function loadMeals() {
  const selectedDate = window._mealsSelectedDate;
  document.getElementById('mealsDateText').textContent = formatDateCN(selectedDate);
  const mealTypes = [
    { key: 'breakfast', label: '🌅 早餐' },
    { key: 'lunch', label: '☀️ 午餐' },
    { key: 'dinner', label: '🌙 晚餐' },
    { key: 'snack', label: '🍎 加餐' }
  ];

  dbGetAll('meals').then(function(all) {
    const dayMeals = all.filter(function(m) { return m.date === selectedDate; });
    const cardsEl = document.getElementById('mealsCards');
    cardsEl.innerHTML = mealTypes.map(function(mt) {
      const items = dayMeals.filter(function(m) { return m.mealType === mt.key; });
      const totalCal = items.reduce(function(s, m) { return s + (m.calories || 0); }, 0);
      let itemsHtml = '';
      if (items.length === 0) {
        itemsHtml = '<div class="meal-empty" data-meal="' + mt.key + '">点击添加' + mt.label.replace(/^[^\s]+\s/, '') + '</div>';
      } else {
        itemsHtml = items.map(function(item) {
          return '<div class="meal-item" data-id="' + item.id + '">' +
            '<span class="foods">' + escapeHtml(item.foods) + '</span>' +
            '<span class="cal">' + (item.calories || 0) + ' kcal</span>' +
            '<span class="actions">' +
              '<button class="meal-edit-btn" title="编辑">✎</button>' +
              '<button class="meal-delete-btn" title="删除">✕</button>' +
            '</span>' +
            '</div>';
        }).join('');
      }
      return '<div class="meal-card">' +
        '<div class="meal-card-header">' +
          '<span class="meal-title">' + mt.label + '</span>' +
          '<span class="meal-calories">' + totalCal + ' kcal</span>' +
          '<button class="add-meal-btn" data-meal="' + mt.key + '">+ 添加</button>' +
        '</div>' +
        itemsHtml +
        '</div>';
    }).join('');

    // Bind events
    cardsEl.querySelectorAll('.add-meal-btn, .meal-empty').forEach(function(btn) {
      btn.addEventListener('click', function() { openMealModal(btn.dataset.meal); });

function updateMealsProgress() {
  const selectedDate = window._mealsSelectedDate;
  dbGetAll('meals').then(function(all) {
    const dayMeals = all.filter(function(m) { return m.date === selectedDate; });
    const consumed = dayMeals.reduce(function(s, m) { return s + (m.calories || 0); }, 0);
    const target = parseInt(document.getElementById('mealsTargetInput').value) || 2000;
    document.getElementById('mealsConsumed').textContent = consumed + ' kcal';
    const pct = target > 0 ? Math.min(100, consumed / target * 100) : 0;
    document.getElementById('mealsProgressFill').style.width = pct + '%';
  });
}

function openMealModal(mealType, existing) {
  const mealLabels = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '加餐' };
  const isEdit = !!existing;
  // 加载常用食物（按频率排序取前8）
  dbGetAll('meals').then(function(all) {
    const freq = {};
    all.forEach(function(m) {
      if (m.foods) {
        const key = m.foods + '||' + (m.calories || 0);
        freq[key] = (freq[key] || 0) + 1;
      }
    });
    const common = Object.keys(freq).sort(function(a, b) { return freq[b] - freq[a]; }).slice(0, 8).map(function(k) {
      const parts = k.split('||');
      return { foods: parts[0], calories: parseInt(parts[1]) || 0 };
    });
    let commonHtml = '';
    if (common.length > 0) {
      commonHtml = '<div class="form-group"><label>常用食物（点击快速填充）</label>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">' +
        common.map(function(c) {
          return '<button type="button" class="btn common-food-btn" data-foods="' + escapeHtml(c.foods) + '" data-cal="' + c.calories + '" style="font-size:12px;padding:4px 10px;">' + escapeHtml(c.foods) + ' (' + c.calories + 'kcal)</button>';
        }).join('') +
        '</div></div>';
    }
    openModal({
      title: (isEdit ? '编辑' : '添加') + mealLabels[mealType],
      bodyHTML:
        '<div class="form-group"><label>食物描述</label>' +
        '<textarea id="mealFoodsInput" placeholder="例如：燕麦粥 + 鸡蛋2个 + 牛奶">' + (existing ? escapeHtml(existing.foods) : '') + '</textarea></div>' +
        '<div class="form-group"><label>热量 (kcal)</label>' +
        '<input type="number" id="mealCalInput" placeholder="估算热量" min="0" value="' + (existing ? existing.calories : '') + '"></div>' +
        commonHtml,
      onConfirm: function() {
        const foods = document.getElementById('mealFoodsInput').value.trim();
        const calories = parseInt(document.getElementById('mealCalInput').value) || 0;
        if (!foods) { showToast('请输入食物描述', 'error'); return false; }
        if (calories < 0) { showToast('热量不能为负数', 'error'); return false; }
        if (isEdit) {
          existing.foods = foods;
          existing.calories = calories;
          dbPut('meals', existing).then(function() { loadMeals(); showToast('已更新'); });
        } else {
          const record = {
            id: genId(),
            date: window._mealsSelectedDate,
            mealType: mealType,
            foods: foods,
            calories: calories,
            createdAt: Date.now()
          };
          dbAdd('meals', record).then(function() { loadMeals(); showToast('已添加'); });
        }
      }
    });
    setTimeout(function() {
      document.querySelectorAll('.common-food-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.getElementById('mealFoodsInput').value = btn.dataset.foods;
          document.getElementById('mealCalInput').value = btn.dataset.cal;
        });
      });
    }, 50);
  });
}

function loadGamesChart() {
  const weekDates = getWeekDates();
  const dayNames = ['一','二','三','四','五','六','日'];
  dbGetAll('gameLogs').then(function(logs) {
    const byDate = {};
    weekDates.forEach(function(d) { byDate[d] = 0; });
    logs.forEach(function(log) {
      if (byDate[log.date] !== undefined) {
        byDate[log.date] += log.duration || 0;
      }
    });
    const maxVal = Math.max.apply(null, Object.values(byDate).concat([1]));
    const chart = document.getElementById('gamesChart');
    chart.innerHTML = weekDates.map(function(ds, i) {
      const val = byDate[ds];
      const heightPct = (val / maxVal) * 80;
      return '<div class="games-chart-bar">' +
        '<div class="bar-value">' + (val > 0 ? val + 'm' : '') + '</div>' +
        '<div class="bar" style="height:' + heightPct + '%"></div>' +
        '<div class="bar-label">周' + dayNames[i] + '</div>' +
        '</div>';
    }).join('');
  });
}

function loadGamesLog() {
  dbGetAll('gameLogs').then(function(logs) {
    logs.sort(function(a, b) { return new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt; });

      container.innerHTML = '<div class="empty-state"><div class="icon">🎮</div>还没有游戏记录</div>';
      return;

    container.innerHTML = logs.map(function(log) {
      const hours = Math.floor((log.duration || 0) / 60);

      return '<div class="game-log-item" data-id="' + log.id + '">' +
        '<span class="game-date">' + formatDateCN(log.date) + '</span>' +

function loadBookStats() {

    const readingEl = document.getElementById('bookReadingCount');
    const finishedEl = document.getElementById('bookFinishedCount');
    const wantEl = document.getElementById('bookWantCount');
    if (readingEl) readingEl.textContent = reading;
    if (finishedEl) finishedEl.textContent = finished;
    if (wantEl) wantEl.textContent = want;

    // 近7天阅读笔记趋势
    const trendChart = document.getElementById('bookTrendChart');
    if (trendChart) {
      dbGetAll('bookNotes').then(function(notes) {
        const byDate = {};
        notes.forEach(function(n) {
          const d = (n.createdAt ? new Date(n.createdAt) : new Date()).toISOString().slice(0,10);
          if (!byDate[d]) byDate[d] = 0;
          byDate[d]++;
        });
        let trendHTML = '';
        for (let i = 6; i >= 0; i--) {
          const date = new Date();
          date.setDate(date.getDate() - i);
          const ds = date.toISOString().slice(0,10);
          const count = byDate[ds] || 0;
          const barHeight = Math.max(count * 20, 4);

          trendHTML += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
            '<div style="font-size:10px;color:var(--text-light);">' + (count > 0 ? count + '篇' : '') + '</div>' +
            '<div style="width:100%;height:' + barHeight + 'px;background:' + (count > 0 ? 'linear-gradient(to top,#9c27b0,#ba68c8)' : 'rgba(156,39,176,0.15)') + ';border-radius:4px 4px 0 0;min-height:4px;"></div>' +

        }
        trendChart.innerHTML = trendHTML;
      });
    }
  });
