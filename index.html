<title>我的空间 - 个人专属APP</title>
<style>
/* ===== CSS Variables - 五条悟主题 ===== */
:root {
  --bg: #0a0e1a;
  --card: rgba(20, 27, 45, 0.85);
  --card-solid: #141b2d;
  --border: rgba(79, 195, 247, 0.3);
  --border-light: rgba(79, 195, 247, 0.15);
  --text: #ffffff;
  --text-light: #8a9bb5;
  --primary: #4fc3f7;
  --primary-light: rgba(79, 195, 247, 0.12);
  --primary-glow: rgba(79, 195, 247, 0.4);
  --purple: #7c4dff;
  --purple-light: rgba(124, 77, 255, 0.15);
  --success: #00e5ff;
  --warning: #ffb74d;
  --danger: #7c4dff;
  --sidebar-bg: linear-gradient(180deg, #0d1220 0%, #0a0e1a 100%);
  --sidebar-text: rgba(255,255,255,0.6);
  --sidebar-active: rgba(79, 195, 247, 0.15);
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --glow-blue: 0 0 12px rgba(79, 195, 247, 0.3);
  --glow-blue-strong: 0 0 20px rgba(79, 195, 247, 0.5);

  --c-home: #4fc3f7;
  --c-tasks: #00e5ff;
  --c-media: #ffb74d;
  --c-english: #4fc3f7;
  --c-experiments: #b388ff;
  --c-workouts: #ff80ab;
  --c-meals: #64ffda;
  --c-games: #bcaaa4;
  --c-books: #8c9eff;
  --c-settings: #90a4ae;
}

/* 浅色主题 */
body.light-theme {
  --bg: #f5f7fa;
  --card: rgba(255, 255, 255, 0.95);
  --card-solid: #ffffff;
  --border: rgba(79, 195, 247, 0.4);
  --border-light: rgba(79, 195, 247, 0.2);
  --text: #1a2332;
  --text-light: #5a6b85;
  --primary: #0288d1;
  --primary-light: rgba(2, 136, 209, 0.1);
  --primary-glow: rgba(2, 136, 209, 0.3);
  --sidebar-bg: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
  --sidebar-text: rgba(26, 35, 50, 0.6);
  --sidebar-active: rgba(2, 136, 209, 0.12);
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --glow-blue: 0 0 12px rgba(2, 136, 209, 0.2);
  --glow-blue-strong: 0 0 20px rgba(2, 136, 209, 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  position: relative;
}

/* 咒力纹路背景 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(79, 195, 247, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(124, 77, 255, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(79, 195, 247, 0.02) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* 漂浮咒力粒子 */
.curse-particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  animation: particleFloat linear infinite;
}
@keyframes particleFloat {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.4; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* 滚动条 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(79, 195, 247, 0.3);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(79, 195, 247, 0.5); }

::selection { background: rgba(79, 195, 247, 0.3); color: #fff; }

/* ===== App Layout ===== */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: 210px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid var(--border-light);
  position: relative;
  z-index: 10;
}
.sidebar::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(79,195,247,0.2), transparent);
}
.app-logo {
  color: white;
  font-weight: 700;
  font-size: 15px;
  padding: 20px 18px;
  border-bottom: 1px solid rgba(79,195,247,0.1);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 0 12px rgba(79,195,247,0.5);
}
.app-logo::before {
  content: '👁️';
  font-size: 18px;
  filter: drop-shadow(0 0 6px rgba(79,195,247,0.8));
}
.nav-list { flex: 1; overflow-y: auto; padding: 10px 0; }
.nav-category {
  padding: 14px 18px 6px;
  font-size: 10px;
  font-weight: 600;
  color: rgba(79,195,247,0.4);
  text-transform: uppercase;
  letter-spacing: 2px;
  user-select: none;
}
.nav-category:first-child { padding-top: 6px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s ease;
  user-select: none;
  position: relative;
  border-left: 3px solid transparent;
}
.nav-item:hover {
  background: rgba(79,195,247,0.06);
  color: rgba(255,255,255,0.9);
}
.nav-item.active {
  background: var(--sidebar-active);
  color: var(--primary);
  font-weight: 600;
  border-left-color: var(--primary);
  text-shadow: 0 0 8px rgba(79,195,247,0.6);
}
.nav-item.active::after {
  content: '';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 8px var(--primary), 0 0 16px rgba(79,195,247,0.5);
  animation: cursePulse 2s ease-in-out infinite;
}
@keyframes cursePulse {
  0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
  50% { opacity: 0.6; transform: translateY(-50%) scale(0.8); }
}
.nav-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
  opacity: 0.7;
}
.sidebar-gojo {
  position: relative;
  height: 120px;
  margin: 8px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sidebar-gojo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.7) saturate(1.2);
}
.sidebar-gojo-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, transparent 30%, rgba(10,14,26,0.9) 100%);
}
.sidebar-gojo-text {
  position: absolute;
  bottom: 8px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: var(--primary);
  font-weight: 600;
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(79,195,247,0.8);
}

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 2; }
.topbar {
  height: 56px;
  background: rgba(13, 18, 32, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
  flex-shrink: 0;
}
.page-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.5px;
}
.page-date { font-size: 12px; color: var(--text-light); }
.topbar-actions { margin-left: auto; }
.btn-primary {
  padding: 8px 18px;
  background: linear-gradient(135deg, rgba(79,195,247,0.15), rgba(124,77,255,0.15));
  color: var(--primary);
  border: 1px solid rgba(79,195,247,0.5);
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.btn-primary:hover {
  background: linear-gradient(135deg, rgba(79,195,247,0.25), rgba(124,77,255,0.25));
  border-color: var(--primary);
  box-shadow: 0 0 16px rgba(79,195,247,0.4), inset 0 0 8px rgba(79,195,247,0.1);
  color: #fff;
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.content { flex: 1; overflow-y: auto; padding: 24px 28px; position: relative; }
.page { display: none; }
.page.active {
  display: block;
  animation: pageFadeIn 0.35s ease;
}

  position: relative;

#page-home > * {
  position: relative;
  z-index: 1;
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5, 8, 16, 0.75);
  backdrop-filter: blur(6px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; animation: modalFadeIn 0.25s ease; }
@keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card-solid);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 90%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 40px rgba(79,195,247,0.15), var(--shadow-lg);
  animation: modalSlideUp 0.3s ease;
}
@keyframes modalSlideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 16px; color: var(--primary); letter-spacing: 0.5px; }
.modal-close {
  background: none; border: none; font-size: 22px;
  cursor: pointer; color: var(--text-light); line-height: 1;
  padding: 4px 8px; border-radius: 4px;
  transition: all 0.15s;
}
.modal-close:hover { background: rgba(79,195,247,0.1); color: var(--primary); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border-light);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}
.btn {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: rgba(79,195,247,0.05);
  color: var(--text);
  transition: all 0.2s ease;
}
.btn:hover {
  border-color: var(--primary);
  background: rgba(79,195,247,0.1);
  color: var(--primary);
}
.btn-danger {
  background: rgba(124,77,255,0.15);
  color: #b388ff;
  border-color: rgba(124,77,255,0.5);
}
.btn-danger:hover {
  background: rgba(124,77,255,0.25);
  border-color: var(--purple);
  box-shadow: 0 0 12px rgba(124,77,255,0.4);
  color: #fff;
}

/* Form elements */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-light); letter-spacing: 0.5px; }
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="date"],
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
  transition: all 0.2s ease;
}
.form-group textarea { resize: vertical; min-height: 70px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,195,247,0.15), 0 0 12px rgba(79,195,247,0.2);
  background: rgba(10, 14, 26, 0.8);
}
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* ===== Toast ===== */
.toast-container {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.toast {
  padding: 10px 22px;
  background: rgba(13, 18, 32, 0.95);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 12px rgba(79,195,247,0.15);
  animation: toastIn 0.25s ease;
  max-width: 400px;
  backdrop-filter: blur(8px);
}
.toast.success { background: rgba(0,229,255,0.15); border-color: rgba(0,229,255,0.5); color: var(--success); }
.toast.error { background: rgba(124,77,255,0.15); border-color: rgba(124,77,255,0.5); color: #b388ff; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Undo Bar ===== */
.undo-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(13, 18, 32, 0.95);
  backdrop-filter: blur(10px);
  color: var(--text);
  padding: 14px 24px;
  z-index: 1500;
  align-items: center;
  justify-content: center;
  gap: 16px;
  font-size: 13px;
  border-top: 1px solid var(--border-light);
}
.undo-bar.show { display: flex; }
.undo-btn {
  background: none; border: none; color: var(--primary);
  font-size: 13px; font-weight: 600; cursor: pointer;
  text-decoration: underline;
}

/* ===== Common UI ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(79,195,247,0.4), transparent);
}
.card:hover {
  border-color: var(--border);
  box-shadow: var(--shadow), 0 0 20px rgba(79,195,247,0.08);
  transform: translateY(-2px);
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
  font-size: 13px;
}
.empty-state .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; filter: grayscale(0.3); }

/* Progress bar */
.progress-bar {
  height: 8px;
  background: rgba(79,195,247,0.08);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--purple));
  border-radius: 4px;
  transition: width 0.4s ease;
  box-shadow: 0 0 8px rgba(79,195,247,0.5);
}

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border-light); }
.tab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  user-select: none;
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; text-shadow: 0 0 8px rgba(79,195,247,0.4); }

/* Badge */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

/* ===== Tasks Module ===== */
.tasks-header {
  display: flex;
  gap: 10px;
  align-items: center;
}
.task-input {
  flex: 1;
  padding: 11px 16px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-size: 14px;
  outline: none;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
  transition: all 0.2s;
}
.task-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,195,247,0.12), 0 0 12px rgba(79,195,247,0.2);
}
.task-priority-select {
  padding: 11px 14px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-size: 13px;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
  cursor: pointer;
}
.task-priority-select:focus { outline: none; border-color: var(--primary); }
.task-group { margin-bottom: 18px; }
.task-group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 8px;
  padding-left: 4px;
  letter-spacing: 1px;
}
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  transition: all 0.2s ease;
}
.task-item:hover {
  border-color: var(--border);
  background: rgba(20, 27, 45, 0.95);
}
.task-item.completed { opacity: 0.45; }
.task-item.completed .task-content { text-decoration: line-through; }
.task-checkbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.task-content {
  flex: 1;
  font-size: 14px;
  cursor: pointer;
  word-break: break-all;
}
.task-priority-badge {
  color: #fff;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  font-weight: 600;
}
.task-edit-btn, .task-delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 4px 6px;
  border-radius: 4px;
  color: var(--text-light);
  opacity: 0;
  transition: all 0.15s;
}
.task-item:hover .task-edit-btn,
.task-item:hover .task-delete-btn { opacity: 1; }
.task-edit-btn:hover { background: rgba(79,195,247,0.1); color: var(--primary); }

  align-items: flex-end;
  gap: 8px;
  height: 120px;
  padding: 0 8px;
}
.games-chart-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
}
.games-chart-bar .bar {
  width: 100%;
  max-width: 40px;
  background: linear-gradient(180deg, var(--c-games), rgba(188,170,164,0.4));
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  transition: height 0.3s;
  box-shadow: 0 0 8px rgba(188,170,164,0.3);
}
.games-chart-bar .bar-value {
  font-size: 10px;
  color: var(--text-light);
  margin-bottom: 4px;
}
.games-chart-bar .bar-label {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 6px;
}
.games-library-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.games-library-bar .title { font-size: 14px; font-weight: 600; }
.games-library-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.game-tag {
  padding: 5px 12px;
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.game-tag:hover { border-color: var(--c-games); background: rgba(188,170,164,0.08); }
.game-tag .remove { color: #ff8a80; font-weight: bold; }
.game-log-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  transition: all 0.2s;
}
.game-log-item:hover { border-color: var(--border); }
.game-log-item .game-date {
  font-size: 12px;
  color: var(--text-light);
  min-width: 80px;
  flex-shrink: 0;
}
.game-log-item .game-name {
  font-weight: 600;
  font-size: 13px;
  min-width: 100px;
  flex-shrink: 0;
}
.game-log-item .game-duration {
  font-size: 12px;
  color: var(--c-games);
  font-weight: 600;
  min-width: 60px;
  flex-shrink: 0;
}
.game-log-item .game-content {
  flex: 1;
  font-size: 12px;
  color: var(--text-light);
}
.game-log-item .actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.game-log-item:hover .actions { opacity: 1; }
.game-log-item .actions button {
  background: none; border: none; cursor: pointer;
  font-size: 12px; padding: 2px 6px; border-radius: 3px; color: var(--text-light);
}
.game-log-item .actions button:hover { background: rgba(79,195,247,0.1); color: var(--primary); }

/* ===== Workouts Module ===== */
.workout-week-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.workout-day-cell {
  background: var(--card);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.workout-day-cell:hover { border-color: var(--c-workouts); }
.workout-day-cell.active {
  border-color: var(--c-workouts);
  background: rgba(255,128,171,0.08);
  box-shadow: 0 0 12px rgba(255,128,171,0.15);
}
.workout-day-cell.has-workout {
  background: linear-gradient(135deg, rgba(255,128,171,0.25), rgba(233,30,99,0.25));
  color: white;
  border-color: rgba(255,128,171,0.4);
}
.workout-day-cell.has-workout.active { background: rgba(255,128,171,0.1); color: var(--text); }
.workout-day-cell .day-name { font-size: 11px; opacity: 0.7; }
.workout-day-cell .day-num { font-size: 16px; font-weight: 700; margin: 2px 0; }
.workout-day-cell .day-mark { font-size: 10px; }
.workout-detail-card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.workout-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.workout-detail-header .muscle-group { font-size: 15px; font-weight: 600; }
.workout-detail-header .duration { font-size: 13px; color: var(--text-light); }
.exercise-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.exercise-table th {
  text-align: left;
  padding: 10px 6px;
  border-bottom: 2px solid var(--border-light);
  color: var(--text-light);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.5px;
}
.exercise-table td {
  padding: 10px 6px;
  border-bottom: 1px solid rgba(79,195,247,0.06);
}
.exercise-table .pr-badge {
  display: inline-block;
  padding: 1px 8px;
  background: linear-gradient(135deg, var(--warning), #ff9800);
  color: #1a1a2e;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  margin-left: 6px;
}
.workout-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.workout-stat-card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.workout-stat-card:hover { border-color: var(--border); transform: translateY(-2px); }
.workout-stat-card .num { font-size: 24px; font-weight: 700; color: var(--c-workouts); text-shadow: 0 0 10px rgba(255,128,171,0.3); }
.workout-stat-card .label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.exercise-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  align-items: center;
}
.exercise-input-row input {
  padding: 7px 10px;
  border: 1px solid var(--border-light);
  border-radius: 4px;
  font-size: 12px;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
}
.exercise-input-row input:focus { outline: none; border-color: var(--primary); }
.exercise-input-row .ex-name { flex: 2; }
.exercise-input-row .ex-num { width: 60px; }
.exercise-input-row .remove-ex-btn {
  background: none; border: none; color: #ff8a80;
  cursor: pointer; font-size: 18px; padding: 0 4px;
}

/* ===== Books Module ===== */
.books-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-light);
}
.books-tab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  user-select: none;
  transition: all 0.2s;
}
.books-tab:hover { color: var(--text); }
.books-tab.active { color: var(--c-books); border-bottom-color: var(--c-books); font-weight: 600; text-shadow: 0 0 8px rgba(140,158,255,0.4); }
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.book-card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  border-top: 3px solid var(--c-books);
  transition: all 0.25s ease;
  backdrop-filter: blur(8px);
}
.book-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg), 0 0 20px rgba(140,158,255,0.12); border-color: var(--border); }
.book-card .book-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.book-card .book-author { font-size: 12px; color: var(--text-light); margin-bottom: 10px; }
.book-card .book-progress-bar { height: 6px; background: rgba(140,158,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.book-card .book-progress-fill { height: 100%; background: linear-gradient(90deg, var(--c-books), var(--primary)); border-radius: 3px; box-shadow: 0 0 6px rgba(140,158,255,0.5); }
.book-card .book-meta { font-size: 11px; color: var(--text-light); display: flex; justify-content: space-between; }
.book-detail-view { display: none; }
.book-detail-view.active { display: block; }
.book-detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.book-back-btn {
  background: none; border: 1px solid var(--border-light);
  padding: 7px 14px; border-radius: 4px; cursor: pointer;
  font-size: 13px; color: var(--text);
  transition: all 0.2s;
}
.book-back-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(79,195,247,0.08); }
.book-detail-info {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.book-detail-info .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.book-detail-info .author { font-size: 13px; color: var(--text-light); margin-bottom: 14px; }
.book-detail-info .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.book-detail-info .progress-row input[type="range"] { flex: 1; accent-color: var(--c-books); }
.book-detail-info .progress-row .progress-text { font-size: 13px; font-weight: 600; min-width: 50px; color: var(--c-books); }
.book-detail-info .status-select {
  padding: 5px 10px; border: 1px solid var(--border-light);
  border-radius: 4px; font-size: 12px;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
}
.book-detail-info .status-select:focus { outline: none; border-color: var(--primary); }
.notes-timeline { display: flex; flex-direction: column; gap: 10px; }
.note-item {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
  position: relative;
  backdrop-filter: blur(8px);
}
.note-item.quote {
  border-left: 3px solid var(--c-books);
  background: rgba(140,158,255,0.06);
}
.note-item.quote .note-content {
  font-style: italic;
  color: var(--text);
}
.note-item .note-type-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 8px;
}
.note-item .note-type-badge.note { background: rgba(79,195,247,0.12); color: var(--primary); }
.note-item .note-type-badge.quote { background: rgba(140,158,255,0.15); color: var(--c-books); }
.note-item .note-content { font-size: 13px; line-height: 1.7; margin-bottom: 8px; }
.note-item .note-meta { font-size: 11px; color: var(--text-light); display: flex; justify-content: space-between; }
.note-item .note-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.note-item:hover .note-actions { opacity: 1; }
.note-item .note-actions button {
  background: none; border: none; cursor: pointer;
  font-size: 12px; padding: 2px 6px; border-radius: 3px; color: var(--text-light);
}
.note-item .note-actions button:hover { background: rgba(124,77,255,0.1); color: #b388ff; }
.add-note-form {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.add-note-form select {
  padding: 7px 12px; border: 1px solid var(--border-light);
  border-radius: 4px; font-size: 12px; margin-right: 8px;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
}
.add-note-form select:focus { outline: none; border-color: var(--primary); }
.add-note-form textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border-light);
  border-radius: 4px; font-size: 13px; margin: 10px 0;
  min-height: 70px; resize: vertical; font-family: inherit;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
}
.add-note-form textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,195,247,0.1); }
.add-note-form .form-row { display: flex; gap: 8px; }
.add-note-form .form-row input {
  padding: 7px 10px; border: 1px solid var(--border-light);
  border-radius: 4px; font-size: 12px;
  background: rgba(10, 14, 26, 0.6);
  color: var(--text);
}
.add-note-form .form-row input:focus { outline: none; border-color: var(--primary); }

/* ===== Media Module ===== */
.media-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-light);
}
.media-tab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-light);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  user-select: none;
  transition: all 0.2s;
}
.media-tab:hover { color: var(--text); }
.media-tab.active { color: var(--c-media); border-bottom-color: var(--c-media); font-weight: 600; text-shadow: 0 0 8px rgba(255,183,77,0.4); }
.media-tab-content { display: none; }
.media-tab-content.active { display: block; animation: pageFadeIn 0.3s ease; }
.media-filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.media-filter-btn {
  padding: 5px 14px;
  border: 1px solid var(--border-light);
  background: var(--card);
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-light);
  transition: all 0.2s;
}
.media-filter-btn:hover { border-color: var(--c-media); color: var(--c-media); }
.media-filter-btn.active { background: rgba(255,183,77,0.15); color: var(--c-media); border-color: var(--c-media); }
.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.media-card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  border-left: 4px solid #555;
  transition: all 0.25s ease;
  backdrop-filter: blur(8px);
}
.media-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg), 0 0 20px rgba(255,183,77,0.1); border-color: var(--border); }
.media-card.status-idea { border-left-color: #78909c; }
.media-card.status-planning { border-left-color: var(--warning); }
.media-card.status-shooting { border-left-color: #ff7043; }
.media-card.status-scheduled { border-left-color: var(--primary); }
.media-card.status-published { border-left-color: var(--success); }
.media-card .media-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.media-card .media-status-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 10px;
}
.media-card .media-idea { font-size: 12px; color: var(--text-light); margin-bottom: 8px; line-height: 1.6; }
.media-card .media-meta { font-size: 11px; color: var(--text-light); display: flex; justify-content: space-between; }
.media-calendar {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.media-cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.media-cal-header button {
  width: 32px; height: 32px;
  border: 1px solid var(--border-light);
  background: rgba(10, 14, 26, 0.6);

  cursor: pointer;
  font-size: 16px;

.media-cal-header button:hover { border-color: var(--primary); color: var(--primary); }

}
.media-cal-cell {

  flex-direction: column;

}
.media-cal-cell:hover { background: rgba(79,195,247,0.08); }
.media-cal-cell.other-month { color: rgba(138,155,181,0.3); }
.media-cal-cell.today { background: rgba(79,195,247,0.15); font-weight: 700; color: var(--primary); }

.media-cal-cell.has-scheduled { background: rgba(79,195,247,0.12); color: var(--primary); font-weight: 600; }
.media-cal-weekday {
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  padding: 6px 0;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.media-chart-card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
}
.media-chart-card .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.media-chart {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  height: 150px;
  padding: 0 8px;
}
.media-chart-bar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  max-width: 80px;
}
.media-chart-bar .bar {
  width: 100%;
  background: linear-gradient(180deg, var(--c-media), rgba(255,183,77,0.3));
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  box-shadow: 0 0 8px rgba(255,183,77,0.3);
}
.media-chart-bar .bar-value { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.media-chart-bar .bar-label {
  font-size: 10px;
  color: var(--text-light);

  background: var(--card);

.media-data-item .title { flex: 1; font-size: 13px; font-weight: 600; }
.media-data-item .stat { font-size: 12px; color: var(--text-light); min-width: 70px; text-align: right; }

.media-data-item .edit-data-btn {
  background: none; border: 1px solid var(--border-light);

.exp-item {

  padding: 16px;

<script>
(function() {
'use strict';

// ===== Module Configuration =====
const MODULES = {
  home:        { name: '首页总览',     color: 'var(--c-home)',        hasAddBtn: false, addBtnText: '' },
  tasks:       { name: '今日计划',     color: 'var(--c-tasks)',       hasAddBtn: true,  addBtnText: '新增任务' },
  media:       { name: '自媒体',       color: 'var(--c-media)',       hasAddBtn: true,  addBtnText: '新增视频' },
  english:     { name: '英语学习计划', color: 'var(--c-english)',     hasAddBtn: true,  addBtnText: '添加学习任务' },
  experiments: { name: '实验工作',     color: 'var(--c-experiments)', hasAddBtn: true,  addBtnText: '新记录' },
  workouts:    { name: '运动健身计划', color: 'var(--c-workouts)',    hasAddBtn: true,  addBtnText: '记录训练' },
  meals:       { name: '饮食计划',     color: 'var(--c-meals)',       hasAddBtn: true,  addBtnText: '添加饮食' },
  games:       { name: '游戏娱乐',     color: 'var(--c-games)',       hasAddBtn: true,  addBtnText: '记录游戏' },
  books:       { name: '读书感悟',     color: 'var(--c-books)',       hasAddBtn: true,  addBtnText: '添加书籍' },
  settings:    { name: '数据与设置',   color: 'var(--c-settings)',    hasAddBtn: false, addBtnText: '' }
};

const STORE_NAMES = ['tasks','media','english','experiments','files','workouts','meals','games','gameLogs','books','bookNotes','memo','settings','customItems'];

// ===== State =====
let currentPage = 'home';
let db = null;
let undoTimer = null;
let moduleConfig = { hiddenModules: [], customModules: [] };

// ===== 模块配置 =====
const PRESET_MODULES_ORDER = [
  { category: '日常', ids: ['home','tasks'] },
  { category: '学习', ids: ['english','books'] },
  { category: '生活', ids: ['media','experiments','workouts','meals','games'] },
  { category: '系统', ids: ['settings'] }
];
const CUSTOM_ICONS = ['📝','📌','🎯','💡','🎵','✈️','💰','🐱','🌱','🎨','🏃','☕','🎮','📷','🔑','⭐'];
const CUSTOM_COLORS = ['#4fc3f7','#ff9800','#4caf50','#e91e63','#9c27b0','#ff5722','#00bcd4','#8bc34a','#ffc107','#f44336'];

async function loadModuleConfig() {
  try {
    const data = await dbTx('settings','readonly',function(s){ return s.get('moduleConfig'); });
    if (data && data.hiddenModules) moduleConfig = data;
  } catch(e) { console.warn('加载模块配置失败', e); }
}
async function saveModuleConfig() {
  await dbPut('settings', { id:'moduleConfig', ...moduleConfig });
}
function isModuleVisible(id) {
  if (id === 'home' || id === 'settings') return true;
  return !moduleConfig.hiddenModules.includes(id);
}
function getCustomModule(id) {
  return moduleConfig.customModules.find(function(m){ return m.id === id; });
}
function getAllVisibleModules() {
  const result = [];
  PRESET_MODULES_ORDER.forEach(function(group) {
    group.ids.forEach(function(id) {
      if (isModuleVisible(id)) result.push({ id: id, name: MODULES[id].name, color: MODULES[id].color, icon: '', custom: false });
    });
  });
  moduleConfig.customModules.forEach(function(m) {
    if (isModuleVisible(m.id)) result.push({ id: m.id, name: m.name, color: m.color, icon: m.icon, custom: true });
  });
  return result;
}

// ===== Utility Functions =====
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDateCN(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + weekdays[d.getDay()];
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function debounce(fn, delay) {
  let timer = null;
  return function() {
    const args = arguments;
    const ctx = this;
    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(ctx, args); }, delay);
  };
}

function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

// ===== IndexedDB Layer =====
function initDB() {
  return new Promise(function(resolve, reject) {
    const req = indexedDB.open('personal-app', 2);
    req.onupgradeneeded = function(e) {
      const database = e.target.result;
      const stores = {
        tasks:       { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        media:       { keyPath: 'id', indexes: [] },
        english:     { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        experiments: { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        files:       { keyPath: 'id', indexes: [{name:'experimentId', keyPath:'experimentId'}] },
        workouts:    { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        meals:       { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        games:       { keyPath: 'id', indexes: [] },
        gameLogs:    { keyPath: 'id', indexes: [{name:'date', keyPath:'date'}] },
        books:       { keyPath: 'id', indexes: [] },
        bookNotes:   { keyPath: 'id', indexes: [{name:'bookId', keyPath:'bookId'}] },
        memo:        { keyPath: 'id', indexes: [] },
        settings:    { keyPath: 'id', indexes: [] },
        customItems: { keyPath: 'id', indexes: [{name:'moduleId', keyPath:'moduleId'},{name:'date', keyPath:'date'}] }
      };
      for (const name in stores) {
        if (!database.objectStoreNames.contains(name)) {
          const s = stores[name];
          const os = database.createObjectStore(name, { keyPath: s.keyPath });
          s.indexes.forEach(function(idx) {
            os.createIndex(idx.name, idx.keyPath, { unique: false });
          });
        }
      }
    };
    req.onsuccess = function(e) {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function dbTx(storeName, mode, callback) {
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    const result = callback(store);
    tx.oncomplete = function() { resolve(result); };
    tx.onerror = function(e) { reject(e.target.error); };
  });
}

function dbAdd(storeName, data) {
  return dbTx(storeName, 'readwrite', function(store) { store.add(data); return true; });
}

function dbPut(storeName, data) {
  return dbTx(storeName, 'readwrite', function(store) { store.put(data); return true; });
}

function dbGet(storeName, id) {
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(id);
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function dbGetAll(storeName) {
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = function() { resolve(req.result || []); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function dbGetByIndex(storeName, indexName, value) {
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).index(indexName).getAll(value);
    req.onsuccess = function() { resolve(req.result || []); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function dbDelete(storeName, id) {
  return dbTx(storeName, 'readwrite', function(store) { store.delete(id); return true; });
}

function dbClear(storeName) {
  return dbTx(storeName, 'readwrite', function(store) { store.clear(); return true; });
}

function dbCount(storeName) {
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).count();
    req.onsuccess = function() { resolve(req.result || 0); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

// ===== Navigation =====
function navigateTo(pageId) {
  const preset = MODULES[pageId];
  const custom = getCustomModule(pageId);
  if (!preset && !custom) return;
  const mod = preset || custom;
  currentPage = pageId;
  // Update pages
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  let target = document.getElementById('page-' + pageId);
  if (!target && custom) {
    target = document.createElement('div');
    target.id = 'page-' + pageId;
    target.className = 'page';
    document.getElementById('content').appendChild(target);
  }
  if (target) target.classList.add('active');
  // Update nav
  document.querySelectorAll('.nav-item').forEach(function(item) {
    item.classList.toggle('active', item.dataset.page === pageId);
  });
  // Update topbar
  document.getElementById('pageTitle').textContent = mod.name;
  const actions = document.getElementById('topbarActions');
  actions.innerHTML = '';
  const hasAdd = preset ? preset.hasAddBtn : true;
  const addText = preset ? preset.addBtnText : '添加条目';
  if (hasAdd) {
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = addText;
    btn.id = 'topbarAddBtn';
    actions.appendChild(btn);
  }
  // Render page
  renderPage(pageId);
}

function renderPage(pageId) {
  const renderers = {
    home: renderHome,
    tasks: renderTasks,
    media: renderMedia,
    english: renderEnglish,
    experiments: renderExperiments,
    workouts: renderWorkouts,
    meals: renderMeals,
    games: renderGames,
    books: renderBooks,
    settings: renderSettings
  };
  if (renderers[pageId]) {
    renderers[pageId]();
  } else if (getCustomModule(pageId)) {
    renderCustomModule(pageId);
  }
}

// ===== 自定义模块 =====
async function renderCustomModule(moduleId) {
  const mod = getCustomModule(moduleId);
  const container = document.getElementById('page-' + moduleId);
  if (!mod || !container) return;
  const items = await dbGetByIndex('customItems', 'moduleId', moduleId);
  items.sort(function(a,b){ return (a.date||'') > (b.date||'') ? 1 : -1; });

  if (items.length === 0) {
    container.innerHTML = '<div class="custom-empty">' +
      '<div class="ce-icon">' + (mod.icon || '📝') + '</div>' +
      '<div>还没有内容，点击右上角「添加条目」开始记录</div>' +
      '</div>';
  } else {
    container.innerHTML = '<div class="custom-list" id="customList">' +
      items.map(function(item) {
        return '<div class="custom-item ' + (item.completed ? 'completed' : '') + '" data-id="' + item.id + '">' +
          '<input type="checkbox" class="ci-checkbox" ' + (item.completed ? 'checked' : '') + ' style="margin-right:8px;cursor:pointer;">' +
          '<div style="flex:1;">' +
          '<div class="ci-title"><span>' + escapeHtml(item.title || '无标题') + '</span>' +
          '<span class="ci-date">' + (item.date ? formatDateCN(item.date) : '') + '</span></div>' +
          '<div class="ci-content">' + escapeHtml(item.content || '').slice(0, 200) + (item.content && item.content.length > 200 ? '...' : '') + '</div>' +
          '</div>' +
          '<div class="ci-actions">' +
          '<button class="ci-edit">✏️</button>' +
          '<button class="ci-delete danger">🗑️</button>' +
          '</div></div>';
      }).join('') + '</div>';
    container.querySelectorAll('.custom-item').forEach(function(el) {
      // 勾选完成
      el.querySelector('.ci-checkbox').addEventListener('change', async function() {
        const item = items.find(function(i){ return i.id === el.dataset.id; });
        if (item) {
          item.completed = this.checked;
          await dbPut('customItems', item);
          el.classList.toggle('completed', this.checked);
          showToast(this.checked ? '已标记完成' : '已取消完成', 'success');
        }
      });
      el.querySelector('.ci-edit').addEventListener('click', function(e) {
        e.stopPropagation();
        const item = items.find(function(i){ return i.id === el.dataset.id; });
        showCustomItemForm(moduleId, item);
      });
      el.querySelector('.ci-delete').addEventListener('click', function(e) {
        e.stopPropagation();
        showConfirm({
          title: '删除条目',
          message: '确定删除这条记录吗？',
          confirmText: '删除', danger: true,
          onConfirm: async function() {
            await dbDelete('customItems', el.dataset.id);
            showUndoBar('已删除', async function() {
              const item = items.find(function(i){ return i.id === el.dataset.id; });
              if (item) await dbPut('customItems', item);
              renderCustomModule(moduleId);
            });
            renderCustomModule(moduleId);
          }
        });
      });
    });
  }

  const addBtn = document.getElementById('topbarAddBtn');
  if (addBtn) {
    addBtn.style.display = '';
    addBtn.onclick = function() { showCustomItemForm(moduleId, null); };
  }
}

function showCustomItemForm(moduleId, item) {
  const mod = getCustomModule(moduleId);

  openModal({
    title: (isEdit ? '编辑' : '添加') + ' - ' + mod.name,
    bodyHTML:
      '<div class="mm-form-row"><label>标题</label>' +
      '<input type="text" id="ciTitleInput" value="' + (item ? escapeHtml(item.title||'') : '') + '" placeholder="输入标题..."></div>' +
      '<div class="mm-form-row"><label>日期</label>' +

}

// ===== 模块管理 UI =====
function renderModuleManage() {
  const list = document.getElementById('moduleManageList');
  if (!list) return;
  let html = '';
  // 预设模块
  const presetIds = ['tasks','english','books','media','experiments','workouts','meals','games'];
  presetIds.forEach(function(id) {
    const m = MODULES[id];
    const visible = isModuleVisible(id);
    html += '<div class="module-manage-item">' +
      '<span class="mm-icon" style="color:' + m.color + '">●</span>' +
      '<span class="mm-name">' + m.name + '<small>预设模块</small></span>' +
      '<span class="mm-actions"><button class="mm-toggle ' + (visible ? 'on' : '') + '" data-id="' + id + '"></button></span>' +
      '</div>';
  });
  // 自定义模块
  moduleConfig.customModules.forEach(function(m) {
    const visible = isModuleVisible(m.id);
    html += '<div class="module-manage-item">' +
      '<span class="mm-icon">' + (m.icon || '📝') + '</span>' +
      '<span class="mm-name">' + escapeHtml(m.name) + '<small>自定义模块</small></span>' +
      '<span class="mm-actions">' +
      '<button class="mm-toggle ' + (visible ? 'on' : '') + '" data-id="' + m.id + '"></button>' +
      '<button class="mm-del-btn" data-edit="' + m.id + '" title="编辑">✏️</button>' +
      '<button class="mm-del-btn" data-del="' + m.id + '" title="删除">🗑️</button>' +
      '</span></div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.mm-toggle').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      const id = btn.dataset.id;
      const idx = moduleConfig.hiddenModules.indexOf(id);
      if (idx > -1) moduleConfig.hiddenModules.splice(idx, 1);
      else moduleConfig.hiddenModules.push(id);
      await saveModuleConfig();
      renderModuleManage();
      renderSidebar();
      // 如果当前页被隐藏，跳回首页
      if (!isModuleVisible(currentPage) && currentPage !== 'home') navigateTo('home');
    });
  });
  list.querySelectorAll('[data-del]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.dataset.del;
      const m = getCustomModule(id);
      showConfirm({
        title: '删除模块',
        message: '确定删除模块「' + m.name + '」吗？该模块下的所有条目数据将被清空，且无法恢复。',
        confirmText: '删除', danger: true,
        onConfirm: async function() {
          moduleConfig.customModules = moduleConfig.customModules.filter(function(x){ return x.id !== id; });
          moduleConfig.hiddenModules = moduleConfig.hiddenModules.filter(function(x){ return x !== id; });
          await saveModuleConfig();
          // 删除该模块的所有数据
          const items = await dbGetByIndex('customItems', 'moduleId', id);
          for (const item of items) await dbDelete('customItems', item.id);
          // 删除页面容器
          const pageEl = document.getElementById('page-' + id);
          if (pageEl) pageEl.remove();
          renderModuleManage();
          renderSidebar();
          if (currentPage === id) navigateTo('home');
          showToast('模块已删除', 'success');
        }
      });
    });
  });
  list.querySelectorAll('[data-edit]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.dataset.edit;
      const m = getCustomModule(id);
      showAddCustomModuleForm(m);
    });
  });
}

function showAddCustomModuleForm(existing) {

    onConfirm: async function() {

        existing.name = name;

        existing.color = selectedColor;
      } else {

          id: 'custom_' + genId(),
          name: name,
          icon: selectedIcon,
          color: selectedColor,
          createdAt: new Date().toISOString()
        });
      }
      await saveModuleConfig();
      renderModuleManage();
      renderSidebar();
      showToast(isEdit ? '模块已更新' : '模块已添加', 'success');

    }
  });

  // 绑定图标和颜色选择
  setTimeout(function() {
    document.querySelectorAll('#cmIconPicker .mm-icon-dot').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedIcon = el.dataset.icon;
        document.querySelectorAll('#cmIconPicker .mm-icon-dot').forEach(function(x){ x.classList.remove('selected'); });
        el.classList.add('selected');
      });
    });
    document.querySelectorAll('#cmColorPicker .mm-color-dot').forEach(function(el) {
      el.addEventListener('click', function() {
        selectedColor = el.dataset.color;
        document.querySelectorAll('#cmColorPicker .mm-color-dot').forEach(function(x){ x.classList.remove('selected'); });
        el.classList.add('selected');
      });
    });
  }, 50);
}

// ===== Modal =====
function openModal(opts) {
  document.getElementById('modalTitle').textContent = opts.title || '';
  document.getElementById('modalBody').innerHTML = opts.bodyHTML || '';
  const confirmBtn = document.getElementById('modalConfirm');
  const cancelBtn = document.getElementById('modalCancel');
  confirmBtn.textContent = opts.confirmText || '确定';
  confirmBtn.style.display = opts.hideConfirm ? 'none' : '';
  cancelBtn.style.display = opts.hideCancel ? 'none' : '';
  if (opts.danger) { confirmBtn.className = 'btn btn-danger'; } else { confirmBtn.className = 'btn-primary'; }

  function cleanup() {
    confirmBtn.onclick = null;
    cancelBtn.onclick = null;
    document.getElementById('modalClose').onclick = null;
    document.getElementById('modalOverlay').onclick = null;
  }
  confirmBtn.onclick = function() {
    if (opts.onConfirm) {
      const result = opts.onConfirm();
      if (result === false) return; // prevent close
    }
    closeModal();
    cleanup();
  };
  cancelBtn.onclick = function() { closeModal(); cleanup(); };
  document.getElementById('modalClose').onclick = function() { closeModal(); cleanup(); };
  document.getElementById('modalOverlay').onclick = function(e) {
    if (e.target === document.getElementById('modalOverlay')) { closeModal(); cleanup(); }
  };
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function showConfirm(opts) {
  openModal({
    title: opts.title || '确认',
    bodyHTML: '<p style="font-size:14px;">' + escapeHtml(opts.message || '') + '</p>',
    confirmText: opts.confirmText || '确定',
    danger: opts.danger,
    onConfirm: opts.onConfirm
  });
}

function showConfirmWithInput(opts) {
  const body = '<p style="font-size:14px;margin-bottom:12px;">' + escapeHtml(opts.message || '') + '</p>' +
    '<div class="form-group"><label>请输入 "' + escapeHtml(opts.confirmWord || '') + '" 确认</label>' +
    '<input type="text" id="confirmWordInput" placeholder="输入确认词"></div>';
  openModal({
    title: opts.title || '确认操作',
    bodyHTML: body,
    confirmText: opts.confirmText || '确认',
    danger: true,
    onConfirm: function() {
      const val = document.getElementById('confirmWordInput').value.trim();
      if (val !== opts.confirmWord) {
        showToast('确认词不正确', 'error');
        return false;
      }
      if (opts.onConfirm) opts.onConfirm();
    }
  });
}

// ===== Toast =====
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast' + (type ? ' ' + type : '');
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(function() { toast.remove(); }, 300);
  }, 2500);
}

// ===== Undo Bar =====
function showUndoBar(message, onUndo) {
  clearTimeout(undoTimer);
  const bar = document.getElementById('undoBar');
  document.getElementById('undoMessage').textContent = message;
  const btn = document.getElementById('undoBtn');
  btn.onclick = function() {
    clearTimeout(undoTimer);
    bar.classList.remove('show');
    if (onUndo) onUndo();
  };
  bar.classList.add('show');
  undoTimer = setTimeout(function() { bar.classList.remove('show'); }, 5000);
}

function initHomeSearch() {
  const input = document.getElementById('homeSearchInput');
  const suggestions = document.getElementById('homeSearchSuggestions');
  if (!input || !suggestions) return;

  let activeIndex = -1;

  function showSuggestions(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      suggestions.classList.remove('show');
      suggestions.innerHTML = '';
      return;
    }
    const allModules = SEARCH_MODULES.concat(
      moduleConfig.customModules.filter(function(m){ return isModuleVisible(m.id); }).map(function(m) {
        return { id: m.id, name: m.name, icon: m.icon || '📝', keywords: [m.name, '自定义'] };
      })
    );
    const matched = allModules.filter(function(m) {
      return m.name.toLowerCase().indexOf(q) > -1 ||
             m.keywords.some(function(k) { return k.toLowerCase().indexOf(q) > -1; });
    });
    if (matched.length === 0) {
      suggestions.innerHTML = '<div class="home-search-suggestion-item" style="cursor:default;color:var(--text-light);">没有找到匹配的模块</div>';
    } else {
      suggestions.innerHTML = matched.map(function(m, i) {
        return '<div class="home-search-suggestion-item' + (i === activeIndex ? ' active' : '') + '" data-id="' + m.id + '" data-index="' + i + '">' +
          '<span class="s-icon">' + m.icon + '</span>' +
          '<span class="s-name">' + m.name + '</span>' +
          '<span class="s-desc">点击跳转</span>' +
          '</div>';
      }).join('');
      suggestions.querySelectorAll('.home-search-suggestion-item[data-id]').forEach(function(item) {
        item.addEventListener('click', function() {
          navigateTo(item.dataset.id);
          input.value = '';
          suggestions.classList.remove('show');
        });
      });
    }
    suggestions.classList.add('show');
  }

  input.addEventListener('input', function() {
    activeIndex = -1;
    showSuggestions(this.value);
  });

  input.addEventListener('keydown', function(e) {
    const items = suggestions.querySelectorAll('.home-search-suggestion-item[data-id]');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      updateActiveSuggestion(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, -1);
      updateActiveSuggestion(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && items[activeIndex]) {
        items[activeIndex].click();
      } else if (items.length > 0) {
        items[0].click();
      }
    } else if (e.key === 'Escape') {
      suggestions.classList.remove('show');
    }
  });

  function updateActiveSuggestion(items) {
    items.forEach(function(item, i) {
      item.classList.toggle('active', i === activeIndex);
    });
  }

  // 点击页面其他地方关闭建议
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.home-search-bar')) {
      suggestions.classList.remove('show');
    }
  });
}

function searchAndNavigate(query) {
  const q = query.trim().toLowerCase();
  if (!q) return false;
  const matched = SEARCH_MODULES.find(function(m) {
    return m.name.toLowerCase().indexOf(q) > -1 ||
           m.keywords.some(function(k) { return k.toLowerCase().indexOf(q) > -1; });
  });
  if (matched) {
    navigateTo(matched.id);
    return true;
  }
  return false;
}

let _homeDateTimeTimer = null;

function startHomeDateTime() {
  if (_homeDateTimeTimer) clearInterval(_homeDateTimeTimer);
  function update() {
    const now = new Date();
    const dateEl = document.getElementById('homeDateText');
    const timeEl = document.getElementById('homeTimeText');
    const weekdayEl = document.getElementById('homeWeekdayText');
    if (dateEl) {
      dateEl.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
    }
    if (timeEl) {
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      timeEl.textContent = h + ':' + m + ':' + s;
    }
    if (weekdayEl) {
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      weekdayEl.textContent = weekdays[now.getDay()];
    }
  }
  update();
  _homeDateTimeTimer = setInterval(update, 1000);
}

function loadHomeProgress() {
  dbGetAll('tasks').then(function(all) {
    const today = todayStr();
    const todayTasks = all.filter(function(t) { return t.date === today; });
    const done = todayTasks.filter(function(t) { return t.completed; }).length;
    const total = todayTasks.length;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const doneEl = document.getElementById('homeProgressDone');
    const totalEl = document.getElementById('homeProgressTotal');
    const fillEl = document.getElementById('homeProgressFill');
    if (doneEl) doneEl.textContent = done;
    if (totalEl) totalEl.textContent = total;
    if (fillEl) fillEl.style.width = percent + '%';
  });
}

function loadHomeTimeline() {
  dbGetAll('tasks').then(function(all) {
    const today = todayStr();
    const todayTasks = all.filter(function(t) { return t.date === today; });
    // 按创建时间排序
    todayTasks.sort(function(a, b) { return a.createdAt - b.createdAt; });
    const timelineEl = document.getElementById('homeTimeline');
    if (!timelineEl) return;
    if (todayTasks.length === 0) {
      timelineEl.innerHTML = '<div class="home-timeline-empty">今天还没有事项，点击右上角添加</div>';
      return;
    }
    timelineEl.innerHTML = todayTasks.map(function(t) {
      const time = new Date(t.createdAt);
      const timeStr = String(time.getHours()).padStart(2, '0') + ':' + String(time.getMinutes()).padStart(2, '0');
      return '<div class="home-timeline-item ' + (t.completed ? 'completed' : '') + '" data-id="' + t.id + '">' +
        '<span class="timeline-time">' + timeStr + '</span>' +
        '<span class="timeline-content">' + escapeHtml(t.content) + '</span>' +
        '</div>';
    }).join('');
    // 点击时间线事项跳转今日计划
    timelineEl.querySelectorAll('.home-timeline-item').forEach(function(item) {
      item.addEventListener('click', function() {
        navigateTo('tasks');
      });
      item.style.cursor = 'pointer';
    });
  });
}

function renderGreeting() {
  const hour = new Date().getHours();
  let greeting = '你好';
  if (hour < 6) greeting = '夜深了';
  else if (hour < 12) greeting = '早上好';
  else if (hour < 14) greeting = '中午好';
  else if (hour < 18) greeting = '下午好';
  else greeting = '晚上好';

  // 五条悟经典台词，按时段随机
  const gojoQuotes = [
    '「因为我最强啊。」',
    '「没关系，我是无敌的。」',
    '「来吧，让我看看你的力量。」',
    '「领域展开——无量空处。」',
    '「你想变强吗？那就变得更强吧。」',
    '「天上天下，唯我独尊。」',
    '「别担心，有我在。」'
  ];
  const quote = gojoQuotes[Math.floor(Math.random() * gojoQuotes.length)];

  dbGetAll('tasks').then(function(all) {
    const today = todayStr();
    const todayTasks = all.filter(function(t) { return t.date === today; });
    const pending = todayTasks.filter(function(t) { return !t.completed; }).length;
    const sub = pending > 0
      ? '今天还有 ' + pending + ' 件待办事项，集中精神——'
      : '今天的待办都完成了，干得漂亮。';
    document.getElementById('homeGreeting').innerHTML =
      greeting + '，术师。' +
      '<div class="sub">' + sub + '</div>' +
      '<span class="quote">' + quote + '</span>';
  });
}

function loadHomeTasks() {
  const listEl = document.getElementById('homeTasksList');
  dbGetAll('tasks').then(function(all) {
    const today = todayStr();
    const todayTasks = all.filter(function(t) { return t.date === today; });
    todayTasks.sort(function(a, b) {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      return a.createdAt - b.createdAt;
    });
    const showTasks = todayTasks.slice(0, 5);
    if (showTasks.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:20px;font-size:13px;">今天还没有待办，去添加一个吧</div>';
      return;
    }
    listEl.innerHTML = showTasks.map(function(t) {
      return '<div class="home-task-item ' + (t.completed ? 'completed' : '') + '" data-id="' + t.id + '">' +
        '<input type="checkbox" class="task-checkbox" ' + (t.completed ? 'checked' : '') + ' style="width:16px;height:16px;flex-shrink:0;">' +
        '<span class="content">' + escapeHtml(t.content) + '</span>' +
        '</div>';
    }).join('');
    if (todayTasks.length > 5) {
      listEl.innerHTML += '<div class="home-task-more" id="homeTaskMore">还有 ' + (todayTasks.length - 5) + ' 件，查看全部 →</div>';
      document.getElementById('homeTaskMore').addEventListener('click', function() {
        navigateTo('tasks');
      });
    }
    // Bind checkbox events
    listEl.querySelectorAll('.home-task-item').forEach(function(item) {
      item.querySelector('.task-checkbox').addEventListener('change', function() {
        const id = item.dataset.id;
        toggleTaskComplete(id, this.checked).then(function() {
          loadHomeTasks();
          renderGreeting();
        });
      });
      // 点击待办项（非checkbox区域）跳转至今日计划
      item.addEventListener('click', function(e) {
        if (e.target.classList.contains('task-checkbox')) return;
        navigateTo('tasks');
      });
      item.style.cursor = 'pointer';
    });
  });
}

function saveMemoContent(content) {
  return dbGet('memo', 'main-memo').then(function(existing) {
    const record = { id: 'main-memo', content: content, updatedAt: Date.now() };
    if (existing) return dbPut('memo', record);
    return dbAdd('memo', record);
  }).then(function() {
    const hint = document.getElementById('homeMemoHint');
    if (hint) hint.textContent = '已自动保存 · ' + new Date().toLocaleTimeString();
  });
}

function loadMemo() {
  const textarea = document.getElementById('homeMemo');
  const hint = document.getElementById('homeMemoHint');
  dbGet('memo', 'main-memo').then(function(memo) {
    if (textarea) textarea.value = memo ? (memo.content || '') : '';
  });
  const saveMemo = debounce(function() {
    saveMemoContent(textarea.value);
  }, 500);
  textarea.addEventListener('input', function() {
    hint.textContent = '保存中...';
    saveMemo();
  });
}

    { id: 'games', icon: '🎮', name: '游戏娱乐', color: 'var(--c-games)' },
    { id: 'meals', icon: '🍽️', name: '饮食计划', color: 'var(--c-meals)' }

  }).join('');

  container.querySelectorAll('.home-summary-card').forEach(function(card) {
    card.addEventListener('click', function() {
      navigateTo(card.dataset.page);
    });
  });

  // Load data for each card
  const today = todayStr();

  // Experiments: latest record title
  dbGetAll('experiments').then(function(all) {
    const el = document.getElementById('summary-experiments-value');
    const desc = document.getElementById('summary-experiments-desc');
    if (all.length > 0) {
      all.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
      el.textContent = all.length + ' 条';
      desc.textContent = '最近: ' + (all[0].title || '').slice(0, 12);
    } else {
      el.textContent = '0 条';
      desc.textContent = '还没有实验记录';
    }
  });

  // English: streak + week completion
  dbGetAll('english').then(function(all) {
    const el = document.getElementById('summary-english-value');
    const desc = document.getElementById('summary-english-desc');
    if (all.length > 0) {
      // Calculate streak
      const byDate = {};
      all.forEach(function(t) {
        if (!byDate[t.date]) byDate[t.date] = [];
        byDate[t.date].push(t);
      });
      let streak = 0;
      let d = new Date();
      while (true) {
        const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        const tasks = byDate[ds] || [];
        if (tasks.some(function(t) { return t.completed; })) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      el.textContent = streak + ' 天';
      desc.textContent = '连续学习';
    } else {
      el.textContent = '0 天';
      desc.textContent = '开始学习吧';

    const weekStart = monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2,'0') + '-' + String(monday.getDate()).padStart(2,'0');
    const weekCount = all.filter(function(w) { return w.date >= weekStart; }).length;

    desc.textContent = '本周训练';
  });

  // Media: latest published/scheduled
  dbGetAll('media').then(function(all) {
    const el = document.getElementById('summary-media-value');
    const desc = document.getElementById('summary-media-desc');
    if (all.length > 0) {
      const published = all.filter(function(m) { return m.status === 'published' || m.status === 'scheduled'; });
      el.textContent = all.length + ' 条';
      if (published.length > 0) {
        published.sort(function(a, b) { return new Date(b.publishDate || 0) - new Date(a.publishDate || 0); });
        desc.textContent = '最近: ' + (published[0].title || '').slice(0, 12);
      } else {
        desc.textContent = '灵感库中有 ' + all.length + ' 条';
      }
    } else {
      el.textContent = '0 条';
      desc.textContent = '还没有视频灵感';
    }
  });

  // Books: currently reading
  dbGetAll('books').then(function(all) {
    const el = document.getElementById('summary-books-value');
    const desc = document.getElementById('summary-books-desc');
    const reading = all.filter(function(b) { return b.status === 'reading'; });
    if (reading.length > 0) {
      el.textContent = reading.length + ' 本';
      desc.textContent = '在读: ' + (reading[0].title || '').slice(0, 10);
    } else {
      el.textContent = all.length + ' 本';
      desc.textContent = all.length > 0 ? '没有正在读的书' : '还没有添加书籍';
    }
  });

  // Games: this week total duration
  dbGetAll('gameLogs').then(function(all) {
    const el = document.getElementById('summary-games-value');
    const desc = document.getElementById('summary-games-desc');
    const now = new Date();
    const dayOfWeek = now.getDay() || 7;
    const monday = new Date(now);
    monday.setDate(now.getDate() - dayOfWeek + 1);
    const weekStart = monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2,'0') + '-' + String(monday.getDate()).padStart(2,'0');
    const weekLogs = all.filter(function(g) { return g.date >= weekStart; });
    const totalMin = weekLogs.reduce(function(sum, g) { return sum + (g.duration || 0); }, 0);
    const hours = Math.floor(totalMin / 60);
    const mins = totalMin % 60;
    el.textContent = hours > 0 ? hours + 'h' + mins + 'm' : mins + 'm';
    desc.textContent = '本周游戏 (' + weekLogs.length + ' 次)';
  });

  // Meals: today calories
  dbGetAll('meals').then(function(all) {
    const el = document.getElementById('summary-meals-value');
    const desc = document.getElementById('summary-meals-desc');
    const todayMeals = all.filter(function(m) { return m.date === today; });
    const calories = todayMeals.reduce(function(sum, m) { return sum + (m.calories || 0); }, 0);
    el.textContent = calories + ' kcal';
    desc.textContent = '今日已摄入 (' + todayMeals.length + ' 餐)';
  });
}

    '</div>';

  const input = document.getElementById('taskInput');
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addTask();
  });
  const addBtn = document.getElementById('topbarAddBtn');
  if (addBtn) addBtn.onclick = function() { input.focus(); };

  const scheduleBtn = document.getElementById('aiScheduleBtn');
  if (scheduleBtn) scheduleBtn.onclick = generateTodaySchedule;

  loadAndRenderTasks();
}

function loadAndRenderTasks() {
  const today = todayStr();
  return dbGetAll('tasks').then(function(all) {
    const todayTasks = all.filter(function(t) { return t.date === today; });
    const groups = { high: [], normal: [], low: [] };
    todayTasks.forEach(function(t) {
      if (groups[t.priority]) groups[t.priority].push(t);
    });
    for (const p in groups) {
      groups[p].sort(function(a, b) {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return a.createdAt - b.createdAt;
      });
    }
    ['high', 'normal', 'low'].forEach(function(p) {
      const listEl = document.getElementById('taskList' + p.charAt(0).toUpperCase() + p.slice(1));
      if (listEl) {
        listEl.innerHTML = groups[p].map(renderTaskItem).join('');
        bindTaskEvents(listEl);
        const groupEl = listEl.closest('.task-group');
        if (groupEl) groupEl.style.display = groups[p].length === 0 ? 'none' : '';
      }
    });
    const total = todayTasks.length;
    const done = todayTasks.filter(function(t) { return t.completed; }).length;
    const textEl = document.getElementById('taskProgressText');
    const fillEl = document.getElementById('taskProgressFill');
    if (textEl) textEl.textContent = done + '/' + total;
    if (fillEl) fillEl.style.width = (total > 0 ? (done / total * 100) : 0) + '%';
  });
}

// AI 智能排程：汇总当天各模块任务，AI 生成最优时间安排
async function generateTodaySchedule() {
  if (!aiApiKey) { showToast('请先在设置中配置 API Key', 'error'); return; }
  const btn = document.getElementById('aiScheduleBtn');
  if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
  showToast('AI 正在汇总今日任务并生成排程...', 'info');

  try {
    const today = todayStr();
    // 1. 收集当天各模块任务
    const allTasks = [];
    // 英语任务
    const englishTasks = await dbGetAll('english');
    englishTasks.filter(function(t) { return t.date === today; }).forEach(function(t) {
      allTasks.push({ module: '英语学习', content: t.content, duration: t.duration || 30, type: t.type });
    });
    // 健身任务
    const workoutTasks = await dbGetAll('workouts');
    workoutTasks.filter(function(t) { return t.date === today; }).forEach(function(t) {
      const exerciseNames = (t.exercises || []).map(function(e) { return e.name; }).join('、');
      allTasks.push({ module: '运动健身', content: t.muscleGroup + '训练' + (exerciseNames ? '（' + exerciseNames + '）' : ''), duration: t.duration || 60, type: 'workout' });
    });
    // 读书任务
    const bookTasks = await dbGetAll('customItems');
    bookTasks.filter(function(t) { return t.date === today && t.moduleId === 'reading-plan'; }).forEach(function(t) {
      allTasks.push({ module: '阅读计划', content: t.content || '阅读', duration: 30, type: 'reading' });
    });
    // 自定义模块任务
    const customModules = await dbGetAll('customModules');
    for (const mod of customModules) {
      const items = await dbGetAll('customItems');
      items.filter(function(t) { return t.date === today && t.moduleId === mod.id; }).forEach(function(t) {
        allTasks.push({ module: mod.name, content: t.content || '任务', duration: 30, type: 'custom' });
      });
    }
    // 已有今日计划任务
    const existingTasks = await dbGetAll('tasks');
    const existingToday = existingTasks.filter(function(t) { return t.date === today; });

    if (allTasks.length === 0 && existingToday.length === 0) {
      showToast('今天各模块还没有任务，先生成学习/健身计划吧', 'warning');
      if (btn) { btn.disabled = false; btn.textContent = '生成今日排程'; }
      return;
    }

    // 2. 调用 AI 生成排程
    const taskListText = allTasks.map(function(t, i) {
      return (i+1) + '. [' + t.module + '] ' + t.content + '（约' + t.duration + '分钟）';
    }).join('\n');
    const existingText = existingToday.map(function(t) {
      return '- ' + t.content + (t.completed ? '（已完成）' : '');
    }).join('\n');

    const prompt = `你是一个时间管理专家。请根据用户今天的任务清单，生成一份最优的今日时间安排。

【今日各模块任务】
${taskListText || '（无）'}

【已有今日计划】
${existingText || '（无）'}

【重要】你的回复必须是纯JSON数组，不能包含任何其他文字、解释或markdown标记。直接以[开头，以]结尾。

JSON格式：
[{"time":"08:00","content":"英语听力练习","priority":"high","duration":30,"module":"英语学习"},{"time":"09:00","content":"胸部训练","priority":"normal","duration":60,"module":"运动健身"}]

规则：
1. time格式为HH:MM，从早上8点到晚上10点之间安排
2. priority只能是high、normal、low
3. duration单位分钟
4. 合理安排任务顺序和间隔，避免时间冲突
5. 已完成的任务不要重复安排
6. 只返回JSON数组，不要任何其他内容`;

    const reply = await callDoubaoApi([{ role: 'user', content: prompt }]);
    const schedule = parseScheduleFromText(reply);
    if (!schedule || schedule.length === 0) {
      openModal({
        title: 'AI 返回内容（无法自动解析）',
        bodyHTML: '<div style="max-height:400px;overflow-y:auto;padding:12px;background:rgba(0,0,0,0.2);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;">' + escapeHtml(reply) + '</div>',
        buttons: [{ text: '知道了', close: true }]
      });
      if (btn) { btn.disabled = false; btn.textContent = '生成今日排程'; }
      return;
    }

    // 3. 清空今天旧的 AI 排程任务（保留手动添加的）
    const oldAiTasks = existingToday.filter(function(t) { return t.aiScheduled; });
    for (const t of oldAiTasks) {
      await dbDelete('tasks', t.id);
    }

    // 4. 保存新排程
    let saved = 0;
    for (const item of schedule) {
      await dbAdd('tasks', {
        id: genId(),
        date: today,
        content: (item.time ? '[' + item.time + '] ' : '') + item.content,
        priority: item.priority || 'normal',
        completed: false,
        createdAt: Date.now(),
        aiScheduled: true,
        module: item.module || '',
        duration: item.duration || 30
      });
      saved++;
    }

    showToast('已生成 ' + saved + ' 项今日排程', 'success');
    loadAndRenderTasks();
  } catch(e) {
    console.error('排程生成失败:', e);
    showToast('排程生成失败：' + (e.message || e), 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '生成今日排程'; }
  }
}

// 解析 AI 返回的排程 JSON
function parseScheduleFromText(reply) {
  if (!reply) return null;
  // 尝试直接解析
  try {
    const data = JSON.parse(reply.trim());
    if (Array.isArray(data)) return data;
    if (data.schedule && Array.isArray(data.schedule)) return data.schedule;
  } catch(e) {}
  // 提取 JSON 数组
  const match = reply.match(/\[[\s\S]*\]/);
  if (match) {
    try {
      const data = JSON.parse(match[0]);
      if (Array.isArray(data)) return data;
    } catch(e) {}
  }
  // 提取 JSON 对象中的数组
  const objMatch = reply.match(/\{[\s\S]*\}/);
  if (objMatch) {
    try {
      const data = JSON.parse(objMatch[0]);
      if (Array.isArray(data)) return data;
      if (data.schedule && Array.isArray(data.schedule)) return data.schedule;
    } catch(e) {}
  }
  return null;
}

function renderTaskItem(task) {
  const priorityColors = { high: '#e74c3c', normal: '#f39c12', low: '#95a5a6' };
  const priorityLabel = { high: '高', normal: '普', low: '低' };
  return '<div class="task-item ' + (task.completed ? 'completed' : '') + '" data-id="' + task.id + '">' +
    '<input type="checkbox" class="task-checkbox" ' + (task.completed ? 'checked' : '') + '>' +
    '<span class="task-content">' + escapeHtml(task.content) + '</span>' +
    '<span class="task-priority-badge" style="background:' + (priorityColors[task.priority] || '#999') + '">' + (priorityLabel[task.priority] || '普') + '</span>' +
